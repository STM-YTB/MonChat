<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaChat</title>

  <script src="/socket.io/socket.io.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #111214;
      --bg2: #1a1b1e;
      --bg3: #232428;
      --bg4: #2b2d31;
      --text: #f2f3f5;
      --muted: #949ba4;
      --purple: #5865f2;
      --green: #23a559;
      --red: #ed4245;
      --border: rgba(255,255,255,.06);
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    #auth {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at 20% 20%, #404eed55, transparent 35%),
        radial-gradient(circle at 80% 80%, #8b5cf655, transparent 30%),
        #111214;
    }

    .auth-box {
      width: 420px;
      padding: 34px;
      background: #1e1f22;
      border-radius: 8px;
      box-shadow: 0 20px 70px #0008;
    }

    .auth-box h1 {
      text-align: center;
      margin: 0 0 8px;
    }

    .auth-box p {
      text-align: center;
      color: var(--muted);
      margin-bottom: 25px;
    }

    .auth-box input {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid transparent;
      border-radius: 5px;
      outline: none;
      color: white;
      background: #111214;
    }

    .auth-box input:focus {
      border-color: var(--purple);
    }

    .primary {
      width: 100%;
      padding: 13px;
      border-radius: 5px;
      background: var(--purple);
      color: white;
      font-weight: bold;
    }

    .secondary {
      background: #4e5058;
      color: white;
      padding: 10px 14px;
      border-radius: 5px;
    }

    .danger {
      background: var(--red);
      color: white;
      padding: 10px 14px;
      border-radius: 5px;
    }

    .link-btn {
      color: #00aff4;
      background: transparent;
      margin-top: 15px;
      width: 100%;
    }

    #app {
      height: 100vh;
      display: flex;
    }

    #servers {
      width: 72px;
      background: #0d0e10;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      gap: 10px;
      overflow-y: auto;
    }

    .server-icon {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: #313338;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
      transition: .15s;
      overflow: hidden;
    }

    .server-icon:hover,
    .server-icon.active {
      border-radius: 13px;
      background: var(--purple);
    }

    .server-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #server-panel {
      width: 240px;
      background: #1e1f22;
      display: flex;
      flex-direction: column;
    }

    #server-header {
      height: 56px;
      padding: 0 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: bold;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    #channels {
      flex: 1;
      padding: 15px 8px;
      overflow-y: auto;
    }

    .category {
      color: var(--muted);
      font-size: 12px;
      font-weight: bold;
      padding: 12px 8px 5px;
      text-transform: uppercase;
    }

    .channel {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 2px;
      border-radius: 5px;
      color: var(--muted);
      background: transparent;
      text-align: left;
    }

    .channel:hover,
    .channel.active {
      background: #35373c;
      color: white;
    }

    .channel span {
      margin-right: 7px;
    }

    #voice-users {
      padding: 0 12px 10px;
    }

    .voice-user {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--purple);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      flex-shrink: 0;
      font-weight: bold;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #profile {
      background: #18191c;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 62px;
    }

    #profile-info {
      min-width: 0;
      flex: 1;
    }

    #profile-name {
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #profile-status {
      color: var(--muted);
      font-size: 11px;
    }

    .profile-buttons {
      display: flex;
      gap: 3px;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 5px;
      background: transparent;
      color: #b5bac1;
    }

    .icon-btn:hover {
      background: #35373c;
      color: white;
    }

    #main {
      flex: 1;
      display: flex;
      min-width: 0;
      background: #313338;
    }

    #home {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #topbar {
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 18px;
      border-bottom: 1px solid #202125;
      background: #313338;
    }

    #topbar .title {
      font-weight: bold;
    }

    #topbar button {
      background: transparent;
      color: #b5bac1;
      padding: 8px 10px;
      border-radius: 5px;
    }

    #topbar button:hover {
      background: #3b3d44;
      color: white;
    }

    #content {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    #friends-list {
      width: 230px;
      padding: 20px 10px;
      background: #2b2d31;
      border-right: 1px solid var(--border);
      overflow-y: auto;
    }

    .friend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px;
      border-radius: 6px;
      cursor: pointer;
    }

    .friend-item:hover,
    .friend-item.active {
      background: #3f4148;
    }

    #chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #chat-header {
      height: 58px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 18px;
      border-bottom: 1px solid #202125;
    }

    #chat-header-name {
      font-weight: bold;
      flex: 1;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .message-content {
      min-width: 0;
    }

    .message-author {
      font-weight: bold;
      margin-bottom: 2px;
    }

    .message-time {
      color: var(--muted);
      font-size: 11px;
      margin-left: 5px;
    }

    .message-text {
      color: #dbdee1;
      word-break: break-word;
    }

    #message-form {
      padding: 12px 18px 20px;
    }

    #message-input-wrap {
      background: #383a40;
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 12px;
    }

    #message-input {
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      padding: 13px 5px;
    }

    #server-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #server-channel-title {
      height: 56px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      font-weight: bold;
      border-bottom: 1px solid #202125;
    }

    #server-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      text-align: center;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: #0009;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal {
      width: 500px;
      max-width: calc(100vw - 30px);
      max-height: calc(100vh - 30px);
      overflow-y: auto;
      background: #313338;
      border-radius: 8px;
      box-shadow: 0 20px 80px #0009;
    }

    .modal-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }

    .modal-body {
      padding: 20px;
    }

    .modal-footer {
      padding: 15px 20px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid var(--border);
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      color: #b5bac1;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      background: #1e1f22;
      color: white;
      border: 1px solid transparent;
      border-radius: 5px;
      padding: 11px;
      outline: none;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: var(--purple);
    }

    .settings-layout {
      display: flex;
      min-height: 500px;
    }

    .settings-nav {
      width: 170px;
      background: #2b2d31;
      padding: 15px 8px;
    }

    .settings-nav button {
      width: 100%;
      text-align: left;
      padding: 9px;
      margin-bottom: 3px;
      border-radius: 5px;
      color: #b5bac1;
      background: transparent;
    }

    .settings-nav button:hover,
    .settings-nav button.active {
      background: #404249;
      color: white;
    }

    .settings-page {
      flex: 1;
      padding: 25px;
    }

    .server-setting-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: #2b2d31;
      margin-bottom: 5px;
      border-radius: 6px;
    }

    .server-setting-item .grow {
      flex: 1;
    }

    #call-bar {
      position: absolute;
      top: 56px;
      left: 0;
      right: 0;
      height: 75px;
      background: #1e1f22;
      border-bottom: 1px solid #111;
      display: flex;
      align-items: center;
      padding: 10px 18px;
      gap: 15px;
      z-index: 30;
      box-shadow: 0 5px 20px #0005;
    }

    #call-avatar {
      width: 48px;
      height: 48px;
    }

    #call-info {
      flex: 1;
    }

    #call-status {
      color: var(--green);
      font-size: 12px;
    }

    .call-controls {
      display: flex;
      gap: 8px;
    }

    .call-control {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #383a40;
      color: white;
    }

    .call-control:hover {
      background: #4e5058;
    }

    .call-control.active {
      background: #4e5058;
    }

    .call-control.end {
      background: var(--red);
    }

    .incoming-call {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 350px;
      background: #1e1f22;
      border-radius: 8px;
      padding: 15px;
      z-index: 2000;
      box-shadow: 0 10px 50px #0009;
      border: 1px solid #3f4148;
    }

    .incoming-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .incoming-actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .incoming-actions button {
      flex: 1;
      padding: 10px;
      border-radius: 5px;
      color: white;
    }

    .accept {
      background: var(--green);
    }

    .reject {
      background: var(--red);
    }

    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 3000;
      background: #111214;
      border: 1px solid #3f4148;
      border-radius: 7px;
      padding: 12px 16px;
      box-shadow: 0 10px 40px #0008;
      animation: toastIn .2s ease;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 800px) {
      #server-panel {
        width: 190px;
      }

      #friends-list {
        width: 170px;
      }
    }
  </style>
</head>

<body>

  <section id="auth">
    <div class="auth-box">
      <h1>NovaChat</h1>
      <p id="auth-subtitle">Connecte-toi à ton compte</p>

      <div id="login-form">
        <input id="login-identifier" placeholder="Email ou nom d'utilisateur">
        <input id="login-password" type="password" placeholder="Mot de passe">

        <button class="primary" onclick="login()">
          Se connecter
        </button>

        <button class="link-btn" onclick="showRegister()">
          Créer un compte
        </button>
      </div>

      <div id="register-form" class="hidden">
        <input id="register-email" type="email" placeholder="Email">
        <input id="register-username" placeholder="Nom d'utilisateur">
        <input id="register-display" placeholder="Nom d'affichage">
        <input id="register-password" type="password" placeholder="Mot de passe">

        <button class="primary" onclick="register()">
          Créer mon compte
        </button>

        <button class="link-btn" onclick="showLogin()">
          J'ai déjà un compte
        </button>
      </div>
    </div>
  </section>

  <section id="app" class="hidden">

    <aside id="servers">
      <button class="server-icon active" onclick="goHome()" title="Accueil">
        N
      </button>

      <div id="server-list"></div>

      <button class="server-icon" onclick="openCreateServer()" title="Ajouter un serveur">
        +
      </button>
    </aside>

    <aside id="server-panel">

      <div id="server-header" onclick="openServerSettings()">
        <span id="server-name">Amis</span>
        <span>⌄</span>
      </div>

      <div id="channels"></div>

      <div id="voice-users"></div>

      <div id="profile">
        <div class="avatar" id="profile-avatar"></div>

        <div id="profile-info">
          <div id="profile-name">Utilisateur</div>
          <div id="profile-status">En ligne</div>
        </div>

        <div class="profile-buttons">
          <button class="icon-btn" onclick="toggleMute()" title="Micro">
            🎙
          </button>

          <button class="icon-btn" onclick="openSettings()" title="Paramètres">
            ⚙
          </button>
        </div>
      </div>

    </aside>

    <main id="main">

      <div id="home">

        <div id="topbar">
          <button onclick="goHome()">Amis</button>
          <button onclick="showFriendRequests()">Demandes</button>
          <button onclick="openAddFriend()">Ajouter un ami</button>
        </div>

        <div id="content">

          <div id="friends-list">
            <h3>Amis</h3>
            <div id="friends"></div>
          </div>

          <div id="chat">

            <div id="chat-header">
              <div class="avatar" id="chat-avatar"></div>
              <div id="chat-header-name">Sélectionne un ami</div>

              <button class="icon-btn" onclick="startCall('audio')" title="Appel">
                📞
              </button>

              <button class="icon-btn" onclick="startCall('video')" title="Appel vidéo">
                📹
              </button>
            </div>

            <div id="call-bar" class="hidden">
              <div class="avatar" id="call-avatar"></div>

              <div id="call-info">
                <div id="call-name">Appel</div>
                <div id="call-status">Connexion...</div>
              </div>

              <div class="call-controls">
                <button class="call-control" onclick="toggleMute()" id="call-mute">
                  🎙
                </button>

                <button class="call-control" onclick="toggleCamera()" id="call-camera">
                  📹
                </button>

                <button class="call-control" onclick="fakeScreenShare()">
                  🖥
                </button>

                <button class="call-control" onclick="showToast('Soundboard disponible bientôt')">
                  🔊
                </button>

                <button class="call-control end" onclick="endCall()">
                  ☎
                </button>
              </div>
            </div>

            <div id="messages">
              <div class="empty">
                Sélectionne un ami pour commencer une conversation.
              </div>
            </div>

            <form id="message-form" onsubmit="sendMessage(event)">
              <div id="message-input-wrap">
                <input
                  id="message-input"
                  autocomplete="off"
                  placeholder="Envoyer un message..."
                >
              </div>
            </form>

          </div>

        </div>
      </div>

      <div id="server-content" class="hidden">

        <div id="server-channel-title">
          <span id="server-channel-icon">#</span>
          <span id="server-channel-name">general</span>
        </div>

        <div id="server-messages">
          <div class="empty">
            Bienvenue dans ce salon.
          </div>
        </div>

      </div>

    </main>

  </section>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="incoming-root"></div>

  <script>
    const socket = io();

    let currentUser = null;
    let currentServer = null;
    let currentChannel = null;
    let currentFriend = null;

    let localStream = null;
    let currentCall = null;
    let muted = false;
    let cameraOff = false;

    const peers = new Map();

    const $ = id => document.getElementById(id);

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showToast(message) {
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;

      $("toast-root").appendChild(toast);

      setTimeout(() => toast.remove(), 3000);
    }

    function showLogin() {
      $("login-form").classList.remove("hidden");
      $("register-form").classList.add("hidden");
      $("auth-subtitle").textContent = "Connecte-toi à ton compte";
    }

    function showRegister() {
      $("login-form").classList.add("hidden");
      $("register-form").classList.remove("hidden");
      $("auth-subtitle").textContent = "Crée ton compte NovaChat";
    }

    async function register() {
      const email = $("register-email").value.trim();
      const username = $("register-username").value.trim();
      const displayName =
        $("register-display").value.trim() || username;
      const password = $("register-password").value;

      if (!email || !username || !password) {
        showToast("Remplis tous les champs obligatoires.");
        return;
      }

      try {
        const response = await fetch("/api/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email,
            username,
            displayName,
            password
          })
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
          showToast(data.error || "Erreur lors de l'inscription.");
          return;
        }

        loginWithData(data);
      } catch (error) {
        console.error(error);
        showToast("Impossible de contacter le serveur.");
      }
    }

    async function login() {
      const identifier = $("login-identifier").value.trim();
      const password = $("login-password").value;

      if (!identifier || !password) {
        showToast("Entre tes identifiants.");
        return;
      }

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            identifier,
            password
          })
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
          showToast(data.error || "Connexion impossible.");
          return;
        }

        loginWithData(data);
      } catch (error) {
        console.error(error);
        showToast("Impossible de contacter le serveur.");
      }
    }

    function loginWithData(data) {
      currentUser = data.user;

      localStorage.setItem(
        "novachat_user",
        JSON.stringify(currentUser)
      );

      $("auth").classList.add("hidden");
      $("app").classList.remove("hidden");

      socket.emit("identify", currentUser.id);

      updateProfile();
      loadFriends();
      loadServers();

      goHome();
    }

    function logout() {
      localStorage.removeItem("novachat_user");
      location.reload();
    }

    async function restoreSession() {
      const saved = localStorage.getItem("novachat_user");

      if (!saved) return;

      try {
        const user = JSON.parse(saved);

        const response = await fetch(`/api/user/${user.id}`);

        if (!response.ok) {
          localStorage.removeItem("novachat_user");
          return;
        }

        const data = await response.json();

        if (!data.ok) return;

        currentUser = data.user;

        $("auth").classList.add("hidden");
        $("app").classList.remove("hidden");

        socket.emit("identify", currentUser.id);

        updateProfile();
        loadFriends();
        loadServers();
        goHome();
      } catch {
        localStorage.removeItem("novachat_user");
      }
    }

    function updateProfile() {
      if (!currentUser) return;

      $("profile-name").textContent =
        currentUser.displayName || currentUser.username;

      $("profile-avatar").innerHTML = avatarHtml(currentUser);
    }

    function avatarHtml(user) {
      if (user?.avatar) {
        return `<img src="${escapeHtml(user.avatar)}" alt="">`;
      }

      const name =
        user?.displayName ||
        user?.username ||
        "?";

      return escapeHtml(name.charAt(0).toUpperCase());
    }

    async function loadFriends() {
      if (!currentUser) return;

      const response = await fetch(`/api/friends/${currentUser.id}`);
      const data = await response.json();

      if (!data.ok) return;

      const container = $("friends");
      container.innerHTML = "";

      document.querySelectorAll(".friend-item")

    async function loadMessages() {
      if (!currentFriend) return;

      const response = await fetch(
        `/api/messages/${currentUser.id}/${currentFriend.id}`
      );

      const data = await response.json();

      if (!data.ok) return;

      renderMessages(data.messages);
    }

    function renderMessages(messages) {
      const container = $("messages");

      container.innerHTML = "";

      if (!messages.length) {
        container.innerHTML = `
          <div class="empty">
            Aucun message pour le moment.
          </div>
        `;
        return;
      }

      messages.forEach(message => {
        const author =
          message.from === currentUser.id
            ? currentUser
            : currentFriend;

        const element = document.createElement("div");
        element.className = "message";

        element.innerHTML = `
          <div class="avatar">
            ${avatarHtml(author)}
          </div>

          <div class="message-content">
            <div class="message-author">
              ${escapeHtml(author.displayName)}
              <span class="message-time">
                ${new Date(message.createdAt).toLocaleTimeString(
                  "fr-FR",
                  { hour: "2-digit", minute: "2-digit" }
                )}
              </span>
            </div>

            <div class="message-text">
              ${escapeHtml(message.content)}
            </div>
          </div>
        `;

        container.appendChild(element);
      });

      container.scrollTop = container.scrollHeight;
    }

    async function sendMessage(event) {
      event.preventDefault();

      if (!currentFriend) {
        showToast("Sélectionne un ami.");
        return;
      }

      const input = $("message-input");
      const content = input.value.trim();

      if (!content) return;

      input.value = "";

      const response = await fetch("/api/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          from: currentUser.id,
          to: currentFriend.id,
          content
        })
      });

      const data = await response.json();

      if (!data.ok) {
        showToast(data.error || "Message impossible à envoyer.");
        return;
      }

      await loadMessages();
    }

    socket.on("private_message", message => {
      if (
        currentFriend &&
        (
          message.from === currentFriend.id ||
          message.to === currentFriend.id
        )
      ) {
        loadMessages();
        return;
      }

      playNotificationSound();

      const senderId =
        message.from === currentUser.id
          ? message.to
          : message.from;

      showToast("Nouveau message");
    });

    socket.on("friend_request", data => {
      playNotificationSound();
      showToast(
        `${data.from.displayName} t'a envoyé une demande d'ami.`
      );
    });

    socket.on("friend_accepted", data => {
      loadFriends();
      showToast(
        `${data.user.displayName} est maintenant ton ami.`

    });

        const button = document.createElement("button");
        button.className = "server-icon";

        list.appendChild(button);
      });

    function openServer(serverData) {
      currentServer = serverData;
      currentChannel = null;

      $("home").classList.add("hidden");
      $("server-content").classList.remove("hidden");

      $("server-name").textContent = serverData.name;

    function renderChannels() {
      if (!currentServer) return;

      const textChannels =
        currentServer.channels.filter(
          c => c.type === "text"
        );

      const voiceChannels =
        currentServer.channels.filter(
          c => c.type === "voice"
        );

      let html = "";

      html += `<div class="category">Textuel</div>`;

      textChannels.forEach(channel => {
        html += `
          <button
            class="channel"
            onclick="openServerChannel('${channel.id}')"
          >
            <span>#</span>
            ${escapeHtml(channel.name)}
          </button>
        `;
      });

      html += `<div class="category">Vocal</div>`;

      voiceChannels.forEach(channel => {
        html += `
          <button
            class="channel"
            onclick="joinVoice('${channel.id}')"
          >
            <span>🔊</span>
            ${escapeHtml(channel.name)}
          </button>
        `;

        if (currentChannel === channel.id) {
          html += `<div id="voice-members-${channel.id}"></div>`;
        }
      });

      $("channels").innerHTML = html;

      if (currentChannel) {
        renderVoiceUsers();
      }
    }

    function openServerChannel(channelId) {
      const channel =
        currentServer.channels.find(
          c => c.id === channelId
        );

      if (!channel) return;

      currentChannel = channelId;

      $("server-channel-icon").textContent = "#";
      $("server-channel-name").textContent = channel.name;

      $("server-messages").innerHTML = `
        <div class="empty">
          <div>
            <h2>Bienvenue dans #${escapeHtml(channel.name)}</h2>
            <p>
              C'est le début de ce salon.
            </p>
          </div>
        </div>
      `;

      renderChannels();
    }

    async function joinVoice(channelId) {
      if (!currentServer) return;

      const channel =
        currentServer.channels.find(
          c => c.id === channelId
        );

      if (!channel) return;

      try {
        if (localStream) {
          stopLocalStream();
        }

        localStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: false
        });

        currentChannel = channelId;

        socket.emit("join_voice", {
          serverId: currentServer.id,
          channelId
        });

        $("server-channel-icon").textContent = "🔊";
        $("server-channel-name").textContent =
          channel.name;

        renderChannels();
        renderVoiceUsers();

        playJoinSound();

        showToast(
          `Connecté à ${channel.name}`
        );
      } catch (error) {
        console.error(error);

        showToast(
          "Impossible d'utiliser ton microphone. Vérifie les permissions du navigateur."
        );
      }
    }

      if (!currentServer || !currentChannel) return;

    async function createServer() {
      const name = $("new-server-name").value.trim();
      const file = $("new-server-icon").files[0];

      if (!name) {
        showToast("Donne un nom au serveur.");
        return;
      }

      let icon = "";

      if (file) {
        icon = await fileToDataUrl(file);
      }

      const response = await fetch("/api/servers", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          ownerId: currentUser.id,
          name,
          icon
        })
      });

      const data = await response.json();

      if (!data.ok) {
        showToast(data.error || "Erreur.");
        return;
      }

      closeModal();

      await loadServers();

      openServer(data.server);

      showToast("Serveur créé.");
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;

        reader.readAsDataURL(file);
      });
    }

    async function createInvite() {
      const response = await fetch(
        `/api/servers/${currentServer.id}/invites`,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            userId: currentUser.id
          })
        }
      );

      const data = await response.json();

      if (!data.ok) {
        showToast(data.error || "Erreur.");
        return;
      }

      currentServer.invites.push(data.invite);

      serverSettingsPage(
        "invites",
        document.querySelector(".settings-nav button:nth-child(4)")
      );

      showToast("Invitation créée.");
    }

    async function copyInvite(code) {
      const link =
        `${location.origin}/?invite=${code}`;

      try {
        await navigator.clipboard.writeText(link);
        showToast("Invitation copiée.");
      } catch {
        showToast(link);
      }
    }

    async function deleteCurrentServer() {
      if (!currentServer) return;

      const confirmed = confirm(
        `Supprimer définitivement "${currentServer.name}" ?`
      );

      if (!confirmed) return;

      const response = await fetch(
        `/api/servers/${currentServer.id}`,
        {
          method: "DELETE",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            userId: currentUser.id
          })
        }
      );

      const data = await response.json();

      if (!data.ok) {
        showToast(data.error || "Impossible de supprimer.");
        return;
      }

      closeModal();
      currentServer = null;

      await loadServers();
      goHome();

      showToast("Serveur supprimé.");
    }

    socket.on("server_updated", serverData => {
      if (
        currentServer &&
        currentServer.id === serverData.id
      ) {
        currentServer = serverData;
        $("server-name").textContent =
          serverData.name;
        renderChannels();
      }

      loadServers();
    });

    socket.on("server_deleted", data => {
      if (
        currentServer &&
        currentServer.id === data.serverId
      ) {
        currentServer = null;
        goHome();
      }

      loadServers();
    });

    function closeModal(event) {
      if (
        event &&
        event.target &&
        !event.target.classList.contains("modal-backdrop")
      ) {
        return;
      }

      $("modal-root").innerHTML = "";
    }

    function toggleMute() {
      muted = !muted;

      if (localStream) {
        localStream.getAudioTracks().forEach(track => {
          track.enabled = !muted;
        });
      }

      $("profile-status").textContent =
        muted ? "Micro coupé" : "En ligne";

      if ($("call-mute")) {
        $("call-mute").classList.toggle(
          "active",
          muted
        );
      }
    }

    function toggleCamera() {
      cameraOff = !cameraOff;

      if (localStream) {
        localStream.getVideoTracks().forEach(track => {
          track.enabled = !cameraOff;
        });
      }

      showToast(
        cameraOff
          ? "Caméra désactivée"
          : "Caméra activée"
      );
    }

    function fakeScreenShare() {
      showToast(
        "Le partage d'écran nécessite l'autorisation du navigateur."
      );
    }

    async function startCall(type = "audio") {
      if (!currentFriend) {
        showToast("Sélectionne un ami avant d'appeler.");
        return;
      }

      try {
        localStream =
          await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: type === "video"
          });

        const callId = crypto.randomUUID();

        currentCall = {
          id: callId,
          type,
          friend: currentFriend,
          state: "calling"
        };

        showCallBar();

        socket.emit("private_call_invite", {
          targetUserId: currentFriend.id,
          callId,
          callType: type
        });

        playCallingSound();

        $("call-status").textContent =
          "Appel en cours...";
      } catch (error) {
        console.error(error);

        showToast(
          "Impossible d'accéder au microphone ou à la caméra."
        );
      }
    }

    socket.on("private_call_incoming", data => {
      if (!currentUser) return;

      playCallingSound();

      showIncomingCall(data);
    });

    async function showIncomingCall(data) {
      const response =
        await fetch(`/api/user/${data.fromUserId}`);

      const result =
        await response.json();

      if (!result.ok) return;

      const user = result.user;

      $("incoming-root").innerHTML = `
        <div class="incoming-call">

          <div class="incoming-top">

            <div class="avatar">
              ${avatarHtml(user)}
            </div>

            <div>
              <b>${escapeHtml(user.displayName)}</b>
              <div style="color:#949ba4">
                ${data.callType === "video"
                  ? "Appel vidéo"
                  : "Appel entrant"}
              </div>
            </div>

          </div>

          <div class="incoming-actions">

            <button
              class="accept"
              onclick='acceptIncomingCall(${JSON.stringify(data)})'
            >
              Accepter
            </button>

            <button
              class="reject"
              onclick='rejectIncomingCall(${JSON.stringify(data)})'
            >
              Refuser
            </button>

          </div>

        </div>
      `;
    }

    async function acceptIncomingCall(data) {
      try {
        localStream =
          await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: data.callType === "video"
          });

        currentCall = {
          id: data.callId,
          type: data.callType,
          friend: {
            id: data.fromUserId
          },
          state: "connected",
          remoteSocketId: data.fromSocketId
        };

        $("incoming-root").innerHTML = "";

        showCallBar();

        $("call-status").textContent =
          "Appel connecté";

        socket.emit("private_call_accept", {
          targetSocketId: data.fromSocketId,
          callId: data.callId
        });

        playJoinSound();
      } catch (error) {
        console.error(error);

        showToast(
          "Impossible d'accéder au microphone."
        );
      }
    }

    function rejectIncomingCall(data) {
      $("incoming-root").innerHTML = "";

      socket.emit("private_call_reject", {
        targetSocketId: data.fromSocketId,
        callId: data.callId
      });

      playLeaveSound();
    }

    socket.on("private_call_accepted", data => {
      if (!currentCall) return;

      currentCall.state = "connected";
      currentCall.remoteSocketId =
        data.fromSocketId;

      $("call-status").textContent =
        "Appel connecté";

      playJoinSound();
    });

    socket.on("private_call_rejected", () => {
      showToast("Appel refusé.");
      endCall(false);
    });

    socket.on("private_call_ended", () => {
      showToast("Appel terminé.");
      endCall(false);
    });

    function showCallBar() {
      if (!currentCall) return;

      $("call-bar").classList.remove("hidden");

      const friend =
        currentCall.friend;

      $("call-name").textContent =
        friend.displayName ||
        friend.username ||
        "Appel";

      $("call-avatar").innerHTML =
        avatarHtml(friend);

      $("call-status").textContent =
        currentCall.state === "connected"
          ? "Appel connecté"
          : "Appel en cours...";
    }

    function endCall(notify = true) {
      if (!currentCall) {
        $("call-bar").classList.add("hidden");
        return;
      }

      if (
        notify &&
        currentCall.remoteSocketId
      ) {
        socket.emit("private_call_end", {
          targetSocketId:
            currentCall.remoteSocketId,
          callId: currentCall.id
        });
      }

      stopLocalStream();

      currentCall = null;

      $("call-bar").classList.add("hidden");

      playLeaveSound();
    }

    function playTone(frequency, duration = 250) {
      try {
        const AudioContext =
          window.AudioContext ||
          window.webkitAudioContext;

        const context =
          new AudioContext();

        const oscillator =
          context.createOscillator();

        const gain =
          context.createGain();

        oscillator.frequency.value =
          frequency;

        gain.gain.value = 0.04;

        oscillator.connect(gain);
        gain.connect(context.destination);

        oscillator.start();

        setTimeout(() => {
          oscillator.stop();
          context.close();
        }, duration);
      } catch {}
    }

    function playNotificationSound() {
      playTone(660, 140);
    }

    function playJoinSound() {
      playTone(520, 120);

      setTimeout(() => {
        playTone(780, 160);
      }, 130);
    }

    function playLeaveSound() {
      playTone(500, 150);

      setTimeout(() => {
        playTone(350, 180);
      }, 120);
    }

    function playCallingSound() {
      playTone(650, 250);
    }

    window.addEventListener("beforeunload", () => {
      stopLocalStream();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeModal();
      }
    });

    socket.on("connect", () => {
      if (currentUser) {
        socket.emit("identify", currentUser.id);
      }
    });

    restoreSession();
  </script>
</body>
</html>
