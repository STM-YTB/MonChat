<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaChat</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #313338;
  --dark: #1e1f22;
  --darker: #111214;
  --sidebar: #2b2d31;
  --hover: #35373c;
  --active: #404249;
  --text: #f2f3f5;
  --muted: #949ba4;
  --blue: #5865f2;
  --green: #23a559;
  --red: #ed4245;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  overflow: hidden;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* =========================
   AUTH
========================= */

#authScreen {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(circle at 20% 20%, #444a9e, transparent 30%),
    radial-gradient(circle at 80% 80%, #653c87, transparent 30%),
    #111214;
}

.authCard {
  width: 430px;
  max-width: calc(100% - 30px);
  background: #2b2d31;
  padding: 32px;
  border-radius: 8px;
  box-shadow: 0 20px 60px #0008;
}

.logo {
  font-size: 30px;
  font-weight: 800;
  text-align: center;
}

.authSubtitle {
  color: var(--muted);
  text-align: center;
  margin: 8px 0 25px;
}

.tabs {
  display: flex;
  background: var(--dark);
  padding: 4px;
  border-radius: 6px;
  margin-bottom: 20px;
}

.tabs button {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 10px;
  border-radius: 4px;
}

.tabs button.active {
  background: var(--blue);
  color: white;
}

.field {
  margin-bottom: 14px;
}

.field label {
  display: block;
  color: var(--muted);
  font-size: 11px;
  font-weight: bold;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.field input {
  width: 100%;
  border: 0;
  outline: 0;
  padding: 12px;
  border-radius: 5px;
  background: var(--dark);
  color: white;
}

.primary {
  width: 100%;
  border: 0;
  background: var(--blue);
  color: white;
  padding: 12px;
  border-radius: 5px;
  font-weight: bold;
}

.error {
  color: #ff8080;
  font-size: 13px;
  min-height: 20px;
  margin-bottom: 5px;
}

/* =========================
   APP
========================= */

#app {
  height: 100vh;
  display: flex;
}

/* SERVERS */

#servers {
  width: 72px;
  background: var(--darker);
  padding: 10px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  overflow-y: auto;
}

.serverButton {
  width: 48px;
  height: 48px;
  border: 0;
  border-radius: 50%;
  background: #313338;
  color: white;
  font-weight: bold;
  overflow: hidden;
  transition: .15s;
}

.serverButton:hover,
.serverButton.active {
  border-radius: 15px;
  background: var(--blue);
}

.serverButton img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.homeButton {
  background: var(--blue);
  font-size: 19px;
}

.addServer {
  color: var(--green);
  font-size: 27px;
}

/* SIDEBAR */

#sidebar {
  width: 255px;
  min-width: 255px;
  background: var(--sidebar);
  display: flex;
  flex-direction: column;
}

#sidebarHeader {
  height: 52px;
  display: flex;
  align-items: center;
  padding: 0 16px;
  border-bottom: 1px solid #1113;
  font-weight: bold;
}

#sidebarContent {
  flex: 1;
  overflow-y: auto;
  padding: 12px 8px;
}

.section {
  color: var(--muted);
  font-size: 11px;
  font-weight: bold;
  text-transform: uppercase;
  padding: 8px;
}

.addFriend {
  width: 100%;
  border: 0;
  background: var(--blue);
  color: white;
  border-radius: 5px;
  padding: 9px;
  margin-bottom: 10px;
}

.friend {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px;
  border-radius: 5px;
  color: var(--muted);
}

.friend:hover,
.friend.active {
  background: var(--active);
  color: white;
}

.avatar {
  width: 36px;
  height: 36px;
  min-width: 36px;
  border-radius: 50%;
  background: var(--blue);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-weight: bold;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.friendText {
  overflow: hidden;
}

.friendName {
  font-weight: bold;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.friendUsername {
  color: var(--muted);
  font-size: 11px;
}

/* CHANNELS */

.channel {
  padding: 8px;
  color: var(--muted);
  border-radius: 5px;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

.channel:hover {
  background: var(--hover);
  color: white;
}

.channel.active {
  background: var(--active);
  color: white;
}

.channelIcon {
  width: 22px;
  font-size: 18px;
}

.voiceMembers {
  margin-left: 28px;
  margin-bottom: 5px;
}

.voiceMember {
  display: flex;
  align-items: center;
  gap: 7px;
  color: #b5bac1;
  font-size: 12px;
  padding: 4px;
}

.voiceMember .avatar {
  width: 25px;
  height: 25px;
  min-width: 25px;
  font-size: 10px;
}

/* USER */

#userBar {
  height: 64px;
  background: #232428;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
}

#userInfo {
  flex: 1;
  min-width: 0;
}

#displayName {
  font-weight: bold;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#username {
  color: var(--muted);
  font-size: 11px;
}

.iconButton {
  border: 0;
  background: transparent;
  color: #b5bac1;
  font-size: 18px;
  padding: 6px;
}

.iconButton:hover {
  color: white;
  background: var(--hover);
  border-radius: 5px;
}

/* MAIN */

#main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

#topbar {
  height: 52px;
  min-height: 52px;
  display: flex;
  align-items: center;
  padding: 0 18px;
  background: #313338;
  border-bottom: 1px solid #1113;
  font-weight: bold;
}

#content {
  flex: 1;
  min-height: 0;
  position: relative;
  display: flex;
  flex-direction: column;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.message {
  display: flex;
  gap: 12px;
  padding: 7px 0;
}

.messageText {
  color: #dbdee1;
  word-break: break-word;
}

.messageHeader {
  display: flex;
  gap: 8px;
  align-items: baseline;
}

.messageName {
  font-weight: bold;
}

.messageTime {
  color: var(--muted);
  font-size: 10px;
}

#composer {
  padding: 12px 20px 20px;
}

#composerBox {
  display: flex;
  align-items: center;
  background: #383a40;
  border-radius: 8px;
  padding: 0 10px;
}

#messageInput {
  flex: 1;
  border: 0;
  outline: 0;
  color: white;
  background: transparent;
  padding: 13px;
}

#sendButton {
  border: 0;
  background: transparent;
  color: #b5bac1;
  font-size: 19px;
}

/* HOME */

#homeView {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--muted);
}

#homeView h1 {
  color: white;
}

/* =========================
   APPEL
========================= */

#callView {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(
      circle at 50% 20%,
      #3b3d45,
      #1e1f22 65%
    );
  display: flex;
  flex-direction: column;
  z-index: 20;
}

.callHeader {
  height: 64px;
  min-height: 64px;
  display: flex;
  align-items: center;
  padding: 0 24px;
  border-bottom: 1px solid #ffffff0b;
}

.callHeaderInfo {
  flex: 1;
}

.callTitle {
  font-weight: bold;
  font-size: 16px;
}

.callStatus {
  color: var(--muted);
  font-size: 12px;
  margin-top: 3px;
}

.callParticipants {
  flex: 1;
  display: flex;
  justify-content: center;
  align-content: center;
  flex-wrap: wrap;
  gap: 22px;
  padding: 30px;
  overflow-y: auto;
}

.callUser {
  width: 220px;
  height: 190px;
  background: #2b2d31;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 10px;
  box-shadow: 0 8px 30px #0004;
}

.callUser .avatar {
  width: 90px;
  height: 90px;
  min-width: 90px;
  font-size: 28px;
}

.callUserName {
  font-weight: bold;
}

.callUserState {
  color: var(--muted);
  font-size: 12px;
}

.callControls {
  height: 100px;
  min-height: 100px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 14px;
}

.callControl {
  width: 54px;
  height: 54px;
  border: 0;
  border-radius: 50%;
  background: #4e5058;
  color: white;
  font-size: 20px;
}

.callControl:hover {
  background: #5c5f68;
}

.callControl.active {
  background: var(--blue);
}

.callControl.hangup {
  background: var(--red);
}

.callControl.hangup:hover {
  background: #ff5558;
}

/* =========================
   MODAL
========================= */

.modal {
  position: fixed;
  inset: 0;
  background: #000b;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 100;
}

.modalCard {
  width: 430px;
  max-width: calc(100% - 25px);
  background: #313338;
  border-radius: 8px;
  padding: 25px;
  box-shadow: 0 20px 60px #0008;
}

.modalCard h2 {
  margin-top: 0;
}

.modalButtons {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

.secondary {
  border: 0;
  background: #4e5058;
  color: white;
  padding: 10px 15px;
  border-radius: 5px;
}

.profilePreview {
  display: flex;
  justify-content: center;
  margin-bottom: 18px;
}

.profilePreview .avatar {
  width: 90px;
  height: 90px;
  min-width: 90px;
  font-size: 30px;
}

@media(max-width: 800px) {
  #servers {
    width: 58px;
  }

  #sidebar {
    width: 220px;
    min-width: 220px;
  }

  .callUser {
    width: 170px;
    height: 160px;
  }
}
</style>
</head>

<body>

<!-- =========================
     AUTH
========================= -->

<div id="authScreen">

  <div class="authCard">

    <div class="logo">NovaChat</div>

    <div class="authSubtitle">
      Discute avec tes amis.
    </div>

    <div class="tabs">
      <button
        id="loginTab"
        class="active"
        onclick="showAuth('login')"
      >
        Connexion
      </button>

      <button
        id="registerTab"
        onclick="showAuth('register')"
      >
        Créer un compte
      </button>
    </div>

    <form id="loginForm">

      <div class="field">
        <label>Email ou nom d'utilisateur</label>
        <input
          id="loginInput"
          type="text"
          required
        >
      </div>

      <div class="field">
        <label>Mot de passe</label>
        <input
          id="loginPassword"
          type="password"
          required
        >
      </div>

      <div id="loginError" class="error"></div>

      <button class="primary">
        Se connecter
      </button>

    </form>

    <form id="registerForm" class="hidden">

      <div class="field">
        <label>Email</label>
        <input
          id="registerEmail"
          type="email"
          required
        >
      </div>

      <div class="field">
        <label>Nom d'utilisateur</label>
        <input
          id="registerUsername"
          type="text"
          maxlength="32"
          required
        >
      </div>

      <div class="field">
        <label>Nom d'affichage</label>
        <input
          id="registerDisplayName"
          type="text"
          maxlength="50"
        >
      </div>

      <div class="field">
        <label>Mot de passe</label>
        <input
          id="registerPassword"
          type="password"
          minlength="6"
          required
        >
      </div>

      <div id="registerError" class="error"></div>

      <button class="primary">
        Créer mon compte
      </button>

    </form>

  </div>
</div>


<!-- =========================
     APPLICATION
========================= -->

<div id="app" class="hidden">

  <aside id="servers">

    <button
      id="homeButton"
      class="serverButton homeButton active"
      onclick="goHome()"
      title="Messages privés"
    >
      N
    </button>

    <div id="serverList"></div>

    <button
      class="serverButton addServer"
      onclick="openModal('serverModal')"
      title="Créer un serveur"
    >
      +
    </button>

  </aside>


  <aside id="sidebar">

    <div id="sidebarHeader">
      <span id="sidebarTitle">
        Messages privés
      </span>
    </div>

    <div id="sidebarContent">

      <div
        id="homeSidebar"
      >

        <div class="section">
          Amis
        </div>

        <button
          class="addFriend"
          onclick="openModal('friendModal')"
        >
          + Ajouter un ami
        </button>

        <div id="friendList"></div>

      </div>

      <div
        id="serverSidebar"
        class="hidden"
      >
      </div>

    </div>

    <div id="userBar">

      <div
        id="currentAvatar"
        class="avatar"
      >
        N
      </div>

      <div id="userInfo">

        <div id="displayName">
          NovaChat
        </div>

        <div id="username">
          @user
        </div>

      </div>

      <button
        class="iconButton"
        onclick="openSettings()"
      >
        ⚙
      </button>

    </div>

  </aside>


  <main id="main">

    <div id="topbar">
      <span id="topbarTitle">
        Messages privés
      </span>
    </div>

    <div id="content">

      <div id="homeView">

        <div>
          <h1>Bienvenue sur NovaChat</h1>
          <p>
            Sélectionne un ami pour discuter.
          </p>
        </div>

      </div>

      <div
        id="messages"
        class="hidden"
      ></div>

      <div
        id="composer"
        class="hidden"
      >

        <div id="composerBox">

          <input
            id="messageInput"
            placeholder="Envoyer un message..."
          >

          <button id="sendButton">
            ➤
          </button>

        </div>

      </div>


      <!-- APPEL -->

      <div

        class="hidden"
      >

        <div class="callHeader">

          <div class="callHeaderInfo">

            <div
              id="callTitle"
              class="callTitle"
            >

            <div

              class="callStatus"

            </div>

        </div>

          class="callParticipants"
        >

        <div class="callControls">

          <button

</div>


<!-- =========================
     MODAL AMI
========================= -->

<div
  id="friendModal"
  class="modal hidden"
>

  <div class="modalCard">

    <h2>Ajouter un ami</h2>

    <div class="field">

      <label>Nom d'utilisateur</label>

      <input

      >

  </div>

</div>


<!-- =========================
     MODAL SERVEUR
========================= -->

<div
  id="serverModal"
  class="modal hidden"
>

  <div class="modalCard">

    <h2>Créer un serveur</h2>

    <div class="field">

      <label>Nom du serveur</label>

      <input
        id="serverName"
        maxlength="80"

    <div class="field">

      id="serverError"

        class="secondary"
        onclick="closeModal('serverModal')"

        Annuler
      </button>

      <button
        class="primary"
        style="width:auto"
        onclick="createServer()"

        Créer
      </button>

    </div>

  </div>

</div>


<!-- =========================
     MODAL PARAMÈTRES
========================= -->

<div
  id="settingsModal"
  class="modal hidden"
>

  <div class="modalCard">

    <h2>Paramètres du compte</h2>

    <div class="profilePreview">

      <div
        id="settingsAvatar"
        class="avatar"
      >
        N
      </div>

    </div>

    <div class="field">

      <label>Photo de profil</label>

      <input
        id="avatarFile"
        type="file"
        accept="image/*"
      >

    </div>

    <div class="field">

      <label>Nom d'affichage</label>

      <input
        id="settingsDisplayName"
        maxlength="50"
      >

    </div>

    <div class="field">

      <label>Nom d'utilisateur</label>

      <input
        id="settingsUsername"
        maxlength="32"
      >

    </div>

    <div
      id="settingsError"
      class="error"
    ></div>

    <div class="modalButtons">

      <button
        class="secondary"
        onclick="closeModal('settingsModal')"
      >
        Annuler
      </button>

      <button
        class="primary"
        style="width:auto"
        onclick="saveSettings()"
      >
        Enregistrer
      </button>

    </div>

  </div>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>
let socket = null;

let currentUser = null;
let friends = [];
let servers = [];

let currentFriend = null;
let currentServer = null;
let currentChannel = null;

let localStream = null;
let peerConnections = {};

let currentCallType = null;
let currentCallTarget = null;

let callAudioEnabled = true;


/* =========================
   UTILS
========================= */

function escapeHtml(value) {
  const div =
    document.createElement("div");

  div.textContent =
    value == null ? "" : String(value);

  return div.innerHTML;
}

function initials(name) {
  return String(name || "N")
    .trim()
    .split(/\s+/)
    .slice(0, 2)
    .map(
      part =>
        part.charAt(0).toUpperCase()
    )
    .join("") || "N";
}

function avatarHTML(user, small = false) {
  const cls =
    small ? "avatar small" : "avatar";

  if (user && user.avatar) {
    return `
      <div class="${cls}">
        <img src="${escapeHtml(
          user.avatar
        )}">
      </div>
    `;
  }

  return `
    <div class="${cls}">
      ${escapeHtml(
        initials(
          user
            ? user.displayName
            : "N"
        )
      )}
    </div>
  `;
}

function showError(id, message) {
  const element =
    document.getElementById(id);

  if (element) {
    element.textContent =
      message || "";
  }
}

async function api(url, options = {}) {
  const response =
    await fetch(url, options);

  const data =
    await response.json();

  if (!response.ok || data.ok === false) {
    throw new Error(
      data.error ||
      "Une erreur est survenue."
    );
  }

  return data;
}

function readFile(file) {
  return new Promise(
    (resolve, reject) => {
      const reader =
        new FileReader();

      reader.onload =
        () =>
          resolve(
            reader.result
          );

      reader.onerror =
        reject;

      reader.readAsDataURL(file);
    }
  );
}


/* =========================
   AUTH
========================= */

function showAuth(type) {
  const login =
    document.getElementById(
      "loginForm"
    );

  const register =
    document.getElementById(
      "registerForm"
    );

  const loginTab =
    document.getElementById(
      "loginTab"
    );

  const registerTab =
    document.getElementById(
      "registerTab"
    );

  if (type === "register") {
    login.classList.add("hidden");
    register.classList.remove(
      "hidden"
    );

    loginTab.classList.remove(
      "active"
    );

    registerTab.classList.add(
      "active"
    );
  } else {
    register.classList.add(
      "hidden"
    );

    login.classList.remove(
      "hidden"
    );

    registerTab.classList.remove(
      "active"
    );

    loginTab.classList.add(
      "active"
    );
  }
}

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async event => {
      event.preventDefault();

async function startApp() {
  document
    .getElementById(
      "authScreen"
    )
    .classList.add("hidden");

  document
    .getElementById(
      "app"
    )
    .classList.remove(
      "hidden"
    );

  updateUserUI();

  connectSocket();

  await loadFriends();
  await loadServers();

  goHome();
}

function connectSocket() {
  socket =
    io();

  socket.on(
    "connect",
    () => {
      socket.emit(
        "identify",
        currentUser.id
      );
    }
  );

  socket.on(
    "dm_message",
    message => {
      if (
        currentFriend &&
        (
          message.from ===
            currentFriend.id ||
          message.to ===
            currentFriend.id
        )
      ) {
        loadDm(
          currentFriend.id
        );
      }
    }
  );

  socket.on(
    "channel_message",
    message => {
      if (
        currentChannel &&
        currentChannel.id ===
          message.channelId
      ) {
        addMessage(
          message
        );
      }
    }
  );

  socket.on(
    "voice_users",
    data => {
      if (
        currentChannel &&
        currentChannel.id ===
          data.channelId
      ) {
        renderVoiceMembers(
          data.users
        );

        if (
          currentCallType ===
          "server"
        ) {
          renderCallParticipants(
            data.users
          );
        }
      }
    }
  );

  socket.on(
    "voice_existing_users",
    async data => {
      if (!localStream) return;

      for (
        const socketId
        of data.users
      ) {
        await createPeer(
          socketId,
          true
        );
      }
    }
  );

  socket.on(
    "voice_user_joined",
    async data => {
      if (!localStream) return;

      await createPeer(
        data.socketId,
        true
      );
    }
  );

  socket.on(
    "voice_user_left",
    data => {
      closePeer(
        data.socketId
      );
    }
  );

  setupWebRTC();
}

function renderMessages(messages) {
  const container =
    document.getElementById(
      "messages"
    );

  container.innerHTML = "";

  messages.forEach(
    message =>
      addMessage(
        message,
        false
      )
  );

  container.scrollTop =
    container.scrollHeight;
}

function addMessage(
  message,
  scroll = true
) {
  const container =
    document.getElementById(
      "messages"
    );

  const user =
    message.from ===
    currentUser.id
      ? currentUser
      : (
          friends.find(
            friend =>
              friend.id ===
              message.from
          ) || {
            displayName:
              message.displayName ||
              "Utilisateur",
            avatar:
              message.avatar ||
              ""
          }
        );

  const element =
    document.createElement(
      "div"
    );

  element.className =
    "message";

  element.innerHTML = `
    ${avatarHTML(user)}

    <div>
      <div class="messageHeader">

        <span class="messageName">
          ${escapeHtml(
            user.displayName
          )}
        </span>

        <span class="messageTime">
          ${new Date(
            message.createdAt
          ).toLocaleTimeString(
            "fr-FR",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          )}
        </span>

      </div>

      <div class="messageText">
        ${escapeHtml(
          message.content
        )}
      </div>
    </div>
  `;

  container.appendChild(
    element
  );

  if (scroll) {
    container.scrollTop =
      container.scrollHeight;
  }
}

async function sendMessage() {
  const input =
    document.getElementById(
      "messageInput"
    );

  const content =
    input.value.trim();

  if (!content) return;

  if (currentFriend) {
    socket.emit(
      "dm_send",
      {
        to:
          currentFriend.id,
        content
      }
    );
  }

  if (
    currentServer &&
    currentChannel &&
    currentChannel.type ===
      "text"
  ) {
    socket.emit(
      "channel_send",
      {
        serverId:
          currentServer.id,
        channelId:
          currentChannel.id,
        content
      }
    );
  }

  input.value = "";
}

document.getElementById(
  "sendButton"
).onclick =
  sendMessage;

document.getElementById(

).addEventListener(

  event => {
    if (
      event.key ===
        "Enter" &&
      !event.shiftKey

async function createServer() {
  showError(
    "serverError",
    ""
  );

  const name =
    document.getElementById(
      "serverName"
    ).value.trim();

  const file =
    document.getElementById(
      "serverIcon"
    ).files[0];

  if (!name) {
    showError(
      "serverError",
      "Entre un nom."
    );
    return;
  }

  let icon = "";

  if (file) {
    if (
      file.size >
      1000000
    ) {
      showError(
        "serverError",
        "Image trop grande. Maximum 1 Mo."
      );
      return;
    }

    icon =
      await readFile(file);
  }

  try {
    const data =
      await api(
        "/api/servers",
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body: JSON.stringify({
            ownerId:
              currentUser.id,
            name,
            icon
          })
        }
      );

    closeModal(
      "serverModal"
    );

    await loadServers();

    openServer(
      data.server
    );

  } catch (error) {
    showError(
      "serverError",
      error.message
    );
  }
}

async function joinServerVoice(

  try {
    if (localStream) {
      endCall();

    localStream =
      await navigator.mediaDevices.getUserMedia(
        {
          audio: true,
          video: false
        }
      );

    currentChannel =
      channel;

    currentCallType =
      "server";

    currentCallTarget =
      null;

    document.getElementById(
      "callView"

    document.getElementById(
      "callTitle"

    document.getElementById(
      "callStatus"

      "Connecté au salon vocal";

    socket.emit(
      "voice_join",
      {
        serverId:
          currentServer.id,
        channelId:
          channel.id
      }
    );

    renderCallParticipants([
      {
        socketId:
          socket.id,
        user:
          currentUser
      }
    ]);

  } catch (error) {
    console.error(error);

    alert(
      "Le microphone n'est pas accessible. Autorise le microphone dans ton navigateur."
    );
  }
}

    ]);

      Pour un appel MP, on crée

    */

        userId:

  } catch (error) {
    console.error(error);

    alert(
      "Impossible d'accéder au microphone."
    );

/* =========================
   WEBRTC
========================= */

function setupWebRTC() {

  socket.on(
    "private_call",
    async data => {

      const friend =
        friends.find(
          user =>
            user.id ===
            data.user.id
        );

      if (!friend) {
        return;
      }

      /*
        L'appel entrant ouvre
        directement l'interface.
      */

      const accept =
        confirm(
          data.user.displayName +
          " t'appelle. Accepter ?"
        );

      if (!accept) {
        return;
      }

      try {

        localStream =
          await navigator.mediaDevices.getUserMedia(
            {
              audio: true,
              video: false
            }
          );

        currentCallType =
          "private";

        currentCallTarget =
          data.socketId;

        currentFriend =
          friend;

        document.getElementById(
          "callView"
        ).classList.remove(
          "hidden"
        );

        document.getElementById(
          "callTitle"
        ).textContent =
          "📞 Appel avec " +
          friend.displayName;

        document.getElementById(
          "callStatus"
        ).textContent =
          "Appel audio";

        renderCallParticipants([
          {
            socketId:
              socket.id,
            user:
              currentUser
          },
          {
            socketId:
              data.socketId,
            user:
              friend
          }
        ]);

        await createPeer(
          data.socketId,
          false
        );

        const peer =
          peerConnections[
            data.socketId
          ];

        await peer.setRemoteDescription(
          new RTCSessionDescription(
            data.offer
          )
        );

        const answer =
          await peer.createAnswer();

        await peer.setLocalDescription(
          answer
        );

        socket.emit(
          "webrtc_answer",
          {
            target:
              data.socketId,
            answer
          }
        );

      } catch (error) {
        console.error(
          error
        );
      }
    }
  );

  socket.on(
    "webrtc_offer",
    async data => {
      if (!localStream) {
        return;
      }

      const peer =
        await createPeer(
          data.from,
          false
        );

      await peer.setRemoteDescription(
        new RTCSessionDescription(
          data.offer
        )
      );

      const answer =
        await peer.createAnswer();

      await peer.setLocalDescription(
        answer
      );

      socket.emit(
        "webrtc_answer",
        {
          target:
            data.from,
          answer
        }
      );
    }
  );

  socket.on(
    "webrtc_answer",
    async data => {
      const peer =
        peerConnections[
          data.from
        ];

      if (!peer) {
        return;
      }

      await peer.setRemoteDescription(
        new RTCSessionDescription(
          data.answer
        )
      );
    }
  );

  socket.on(
    "webrtc_ice",
    async data => {
      const peer =
        peerConnections[
          data.from
        ];

      if (
        !peer ||
        !data.candidate
      ) {
        return;
      }

      try {
        await peer.addIceCandidate(
          new RTCIceCandidate(
            data.candidate
          )
        );
      } catch (error) {
        console.error(
          error
        );
      }
    }
  );
}

async function createPeer(
  socketId,
  createOffer
) {
  if (
    peerConnections[
      socketId
    ]
  ) {
    return peerConnections[
      socketId
    ];
  }

  const peer =
    new RTCPeerConnection(
      {
        iceServers: [
          {
            urls:
              "stun:stun.l.google.com:19302"
          },
          {
            urls:
              "stun:stun1.l.google.com:19302"
          }
        ]
      }
    );

  peerConnections[
    socketId
  ] = peer;

  if (localStream) {
    localStream
      .getTracks()
      .forEach(
        track => {
          peer.addTrack(
            track,
            localStream
          );
        }
      );
  }

  peer.onicecandidate =
    event => {
      if (
        event.candidate
      ) {
        socket.emit(
          "webrtc_ice",
          {
            target:
              socketId,
            candidate:
              event.candidate
          }
        );
      }
    };

  peer.ontrack =
    event => {
      let audio =
        document.getElementById(
          "remote-" +
          socketId
        );

      if (!audio) {
        audio =
          document.createElement(
            "audio"
          );

        audio.id =
          "remote-" +
          socketId;

        audio.autoplay =
          true;

        audio.playsInline =
          true;

        document.body.appendChild(
          audio
        );
      }

      audio.srcObject =
        event.streams[0];

      audio.volume =
        callAudioEnabled
          ? 1
          : 0;
    };

  if (createOffer) {
    const offer =
      await peer.createOffer();

    await peer.setLocalDescription(
      offer
    );

    socket.emit(
      "webrtc_offer",
      {
        target:
          socketId,
        offer
      }
    );
  }

  return peer;
}

function closePeer(
  socketId
) {
  const peer =
    peerConnections[
      socketId
    ];

  if (peer) {
    try {
      peer.close();
    } catch {}

    delete peerConnections[
      socketId
    ];
  }

  const audio =
    document.getElementById(
      "remote-" +
      socketId
    );

  if (audio) {
    audio.remove();
  }
}


/* =========================
   CONTRÔLES APPEL
========================= */

function toggleMute() {
  if (!localStream) {
    return;
  }

  const tracks =
    localStream.getAudioTracks();

  if (!tracks.length) {
    return;
  }

  const enabled =
    tracks[0].enabled;

  tracks.forEach(
    track => {
      track.enabled =
        !enabled;
    }
  );

  const button =
    document.getElementById(
      "muteButton"
    );

  button.textContent =
    enabled
      ? "🔇"
      : "🎙️";

  button.classList.toggle(
    "active",
    !enabled
  );
}

function toggleSpeaker() {
  callAudioEnabled =
    !callAudioEnabled;

  document
    .querySelectorAll(
      "audio[id^='remote-']"
    )
    .forEach(
      audio => {
        audio.volume =
          callAudioEnabled
            ? 1
            : 0;
      }
    );

  document.getElementById(
    "speakerButton"
  ).classList.toggle(
    "active",
    callAudioEnabled
  );
}

function endCall() {
  if (socket) {
    socket.emit(
      "voice_leave"
    );
  }

  Object.keys(
    peerConnections
  ).forEach(
    socketId =>
      closePeer(
        socketId
      )
  );

  peerConnections =
    {};

  if (localStream) {
    localStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    localStream =
      null;
  }

  document
    .querySelectorAll(
      "audio[id^='remote-']"
    )
    .forEach(
      audio =>
        audio.remove()
    );

  document.getElementById(
    "callView"
  ).classList.add(
    "hidden"
  );

  currentCallType =
    null;

  currentCallTarget =
    null;
}


/* =========================
   SETTINGS
========================= */

function openSettings() {
  document.getElementById(
    "settingsDisplayName"
  ).value =
    currentUser.displayName;

  document.getElementById(
    "settingsUsername"
  ).value =
    currentUser.username;

  const avatar =
    document.getElementById(
      "settingsAvatar"
    );

  if (currentUser.avatar) {
    avatar.innerHTML =
      `<img src="${escapeHtml(
        currentUser.avatar
      )}">`;
  } else {
    avatar.textContent =
      initials(
        currentUser.displayName
      );
  }

  document.getElementById(
    "avatarFile"
  ).value = "";

  showError(
    "settingsError",
    ""
  );

  openModal(
    "settingsModal"
  );
}

async function saveSettings() {
  try {
    showError(
      "settingsError",
      ""
    );

    const displayName =
      document.getElementById(
        "settingsDisplayName"
      ).value.trim();

    const username =
      document.getElementById(
        "settingsUsername"
      ).value.trim();

    const file =
      document.getElementById(
        "avatarFile"
      ).files[0];

    let avatar =
      currentUser.avatar ||
      "";

    if (file) {
      if (
        file.size >
        1500000
      ) {
        throw new Error(
          "Photo trop grande. Maximum 1,5 Mo."
        );
      }

      avatar =
        await readFile(file);
    }

    const profile =
      await api(
        "/api/profile",
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body: JSON.stringify({
            userId:
              currentUser.id,
            displayName,
            avatar
          })
        }
      );

    currentUser =
      profile.user;

    if (
      username &&
      username.toLowerCase() !==
        currentUser.username.toLowerCase()
    ) {
      const result =
        await api(
          "/api/username",
          {
            method: "POST",
            headers: {
              "Content-Type":
                "application/json"
            },
            body: JSON.stringify({
              userId:
                currentUser.id,
              username
            })
          }
        );

      currentUser =
        result.user;
    }

    localStorage.setItem(
      "novachat_user",
      JSON.stringify(
        currentUser
      )
    );

    updateUserUI();

    closeModal(
      "settingsModal"
    );

    await loadFriends();

  } catch (error) {
    showError(
      "settingsError",
      error.message
    );
  }
}


/* =========================
   MODALS
========================= */

function openModal(id) {
  document.getElementById(
    id
  ).classList.remove(
    "hidden"
  );
}

function closeModal(id) {
  document.getElementById(
    id
  ).classList.add(
    "hidden"
  );
}

async function addFriend() {
  const username =
    document.getElementById(
      "friendUsername"
    ).value.trim();

  showError(
    "friendError",
    ""
  );

  if (!username) {
    showError(
      "friendError",
      "Entre un nom d'utilisateur."
    );
    return;
  }

  try {
    await api(
      "/api/friends/add",
      {
        method: "POST",
        headers: {
          "Content-Type":
            "application/json"
        },
        body: JSON.stringify({
          userId:
            currentUser.id,
          username
        })
      }
    );

    closeModal(
      "friendModal"
    );

    document.getElementById(
      "friendUsername"
    ).value = "";

    await loadFriends();

  } catch (error) {
    showError(
      "friendError",
      error.message
    );
  }
}


/* =========================
   INITIALISATION
========================= */

const saved =
  localStorage.getItem(
    "novachat_user"
  );

if (saved) {
  try {
    currentUser =
      JSON.parse(
        saved
      );

    if (
      currentUser &&
      currentUser.id
    ) {
      startApp();
    }
  } catch {
    localStorage.removeItem(
      "novachat_user"
    );
  }
}

window.addEventListener(
  "beforeunload",
  () => {
    if (localStream) {
      endCall();
    }
  }
);
</script>
