<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaChat</title>

<script src="/socket.io/socket.io.js"></script>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #111214;
  --sidebar: #1e1f22;
  --sidebar2: #2b2d31;
  --chat: #313338;
  --input: #383a40;
  --hover: #404249;
  --active: #404249;
  --text: #f2f3f5;
  --muted: #949ba4;
  --accent: #5865f2;
  --green: #23a55a;
  --red: #ed4245;
  --border: rgba(255,255,255,.06);
}

* {
  scrollbar-width: thin;
  scrollbar-color: #1a1b1e transparent;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

button,
input,
textarea {
  font: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* =========================
   LOGIN
========================= */

#loginScreen {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 20%, #5865f233, transparent 35%),
    radial-gradient(circle at 80% 70%, #7289da22, transparent 35%),
    #111214;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.login-card {
  width: 420px;
  padding: 38px;
  background: #1e1f22;
  border-radius: 12px;
  box-shadow: 0 20px 70px #0008;
  text-align: center;
}

.login-logo {
  width: 70px;
  height: 70px;
  margin: auto;
  border-radius: 22px;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  font-weight: 900;
}

.login-card h1 {
  margin: 22px 0 8px;
}

.login-card p {
  color: var(--muted);
}

.login-input {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  background: #111214;
  border: 1px solid #000;
  border-radius: 6px;
  outline: none;
  color: white;
}

.login-input:focus {
  border-color: var(--accent);
}

.login-button {
  width: 100%;
  margin-top: 15px;
  padding: 14px;
  border-radius: 6px;
  background: var(--accent);
  color: white;
  font-weight: bold;
}

.login-button:hover {
  filter: brightness(1.1);
}

#loginStatus {
  margin-top: 12px;
  color: var(--muted);
  font-size: 13px;
}

/* =========================
   APP
========================= */

#app {
  height: 100vh;
  display: flex;
}

/* SERVERS */

.server-bar {
  width: 72px;
  background: #111214;
  padding: 12px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
}

.server {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #313338;
  color: #dbdee1;
  font-size: 18px;
  font-weight: bold;
  transition: .15s;
}

.server:hover,
.server.active {
  border-radius: 16px;
  background: var(--accent);
  color: white;
}

.server.add {
  color: #23a55a;
  font-size: 25px;
}

.server-separator {
  width: 32px;
  height: 1px;
  background: #35373c;
}

/* CHANNEL SIDEBAR */

.channel-sidebar {
  width: 240px;
  background: var(--sidebar);
  display: flex;
  flex-direction: column;
}

.server-header {
  height: 48px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  font-weight: bold;
  box-shadow: 0 1px 4px #0003;
}

.server-header button {
  background: none;
  color: var(--muted);
  font-size: 18px;
}

.channel-list {
  flex: 1;
  overflow-y: auto;
  padding: 12px 8px;
}

.category {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 8px 5px;
  color: var(--muted);
  font-size: 11px;
  font-weight: bold;
  letter-spacing: .5px;
}

.category button {
  background: none;
  color: var(--muted);
}

.channel {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px;
  border-radius: 5px;
  color: var(--muted);
  background: transparent;
  text-align: left;
  margin-bottom: 2px;
}

.channel:hover {
  background: var(--hover);
  color: var(--text);
}

.channel.active {
  background: var(--active);
  color: white;
}

.channel-icon {
  font-size: 21px;
  color: #949ba4;
}

.voice-channel {
  position: relative;
}

.voice-count {
  margin-left: auto;
  color: var(--muted);
  font-size: 11px;
}

/* USER BOX */

.user-box {
  height: 58px;
  padding: 8px;
  background: #232428;
  display: flex;
  align-items: center;
  gap: 8px;
}

.avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  position: relative;
}

.presence {
  position: absolute;
  right: -2px;
  bottom: -1px;
  width: 11px;
  height: 11px;
  border: 3px solid #232428;
  border-radius: 50%;
  background: var(--green);
}

.user-info {
  flex: 1;
  min-width: 0;
}

.user-info strong,
.user-info small {
  display: block;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.user-info small {
  color: var(--muted);
}

.user-actions {
  display: flex;
  gap: 2px;
}

.small-btn {
  width: 30px;
  height: 30px;
  background: transparent;
  color: var(--muted);
  border-radius: 5px;
}

.small-btn:hover {
  background: var(--hover);
  color: white;
}

/* CHAT */

.chat {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--chat);
}

.chat-header {
  height: 48px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
}

.hash {
  color: var(--muted);
  font-size: 27px;
}

.chat-name {
  font-weight: bold;
}

.chat-description {
  color: var(--muted);
  font-size: 11px;
}

.header-spacer {
  flex: 1;
}

.header-button {
  background: transparent;
  color: #b5bac1;
  font-size: 19px;
  width: 34px;
  height: 34px;
  border-radius: 5px;
}

.header-button:hover {
  background: var(--hover);
  color: white;
}

/* MESSAGES */

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 0;
}

.message {
  display: flex;
  gap: 12px;
  padding: 5px 18px;
}

.message:hover {
  background: #2e3035;
}

.message-avatar {
  width: 40px;
  height: 40px;
  flex-shrink: 0;
  border-radius: 50%;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.message-content {
  min-width: 0;
}

.message-author {
  font-weight: bold;
}

.message-time {
  color: var(--muted);
  font-size: 10px;
  margin-left: 6px;
}

.message-text {
  margin-top: 3px;
  color: #dbdee1;
  white-space: pre-wrap;
  word-break: break-word;
}

/* COMPOSER */

.composer-area {
  padding: 0 16px 22px;
}

.composer {
  min-height: 48px;
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--input);
  border-radius: 8px;
  padding: 5px 8px;
}

.composer button {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: transparent;
  color: #b5bac1;
  font-size: 20px;
}

.composer button:hover {
  color: white;
}

#messageInput {
  flex: 1;
  resize: none;
  border: 0;
  outline: 0;
  background: transparent;
  color: white;
  padding: 8px;
  max-height: 120px;
}

/* MEMBERS */

.member-sidebar {
  width: 230px;
  background: #2b2d31;
  padding: 18px 10px;
  overflow-y: auto;
}

.member-title {
  color: var(--muted);
  font-size: 12px;
  font-weight: bold;
  padding: 5px 8px;
}

.member {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px;
  border-radius: 5px;
  cursor: pointer;
}

.member:hover {
  background: var(--hover);
}

.member-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
}

.member-name {
  font-weight: bold;
  font-size: 14px;
}

.member-status {
  font-size: 11px;
  color: var(--muted);
}

/* =========================
   VOCAL
========================= */

.voice-panel {
  position: fixed;
  bottom: 0;
  left: 72px;
  width: 240px;
  background: #111214;
  padding: 8px;
  border-top: 1px solid var(--border);
  z-index: 30;
}

.voice-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.voice-connected {
  color: var(--green);
  font-size: 11px;
}

.voice-room {
  font-weight: bold;
}

.voice-users {
  margin-top: 8px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.voice-user {
  padding: 4px 7px;
  border-radius: 4px;
  background: #2b2d31;
  color: #dbdee1;
  font-size: 11px;
}

.voice-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 10px;
}

.voice-control {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #2b2d31;
  color: white;
}

.voice-control:hover {
  background: #404249;
}

.voice-control.active {
  background: var(--green);
}

.voice-control.danger {
  background: var(--red);
}

/* VIDEOS */

.video-grid {
  position: fixed;
  inset: 60px 250px 80px 320px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 10px;
  padding: 10px;
  z-index: 10;
  pointer-events: none;
}

.video-tile {
  background: #111214;
  border-radius: 8px;
  overflow: hidden;
  position: relative;
  min-height: 180px;
}

.video-tile video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.video-name {
  position: absolute;
  bottom: 8px;
  left: 8px;
  padding: 5px 8px;
  border-radius: 4px;
  background: #000b;
  font-size: 12px;
}

/* =========================
   MODALS
========================= */

.modal {
  position: fixed;
  inset: 0;
  background: #0009;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 500;
}

.modal-box {
  width: 440px;
  max-width: 92vw;
  max-height: 85vh;
  overflow-y: auto;
  background: #313338;
  border-radius: 8px;
  padding: 25px;
  box-shadow: 0 20px 80px #0009;
}

.modal-box h2 {
  margin-top: 0;
}

.modal-label {
  display: block;
  color: var(--muted);
  font-size: 12px;
  font-weight: bold;
  margin-top: 15px;
  margin-bottom: 6px;
}

.modal-input,
.modal-select {
  width: 100%;
  padding: 11px;
  border-radius: 5px;
  border: 0;
  outline: 0;
  background: #1e1f22;
  color: white;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 20px;
}

.modal-button {
  padding: 10px 16px;
  border-radius: 5px;
  background: #4e5058;
  color: white;
}

.modal-button.primary {
  background: var(--accent);
}

.modal-button.danger {
  background: var(--red);
}

/* FRIENDS */

.friends-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.friends-header {
  height: 48px;
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
}

.friends-header strong {
  font-size: 16px;
}

.friend-tabs {
  display: flex;
  gap: 8px;
}

.friend-tab {
  padding: 7px 10px;
  border-radius: 5px;
  color: var(--muted);
  background: transparent;
}

.friend-tab:hover,
.friend-tab.active {
  background: var(--hover);
  color: white;
}

.friend-list {
  padding: 20px;
  overflow-y: auto;
}

.friend-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border-top: 1px solid var(--border);
}

.friend-info {
  flex: 1;
}

.friend-buttons {
  display: flex;
  gap: 5px;
}

/* RESPONSIVE */

@media(max-width:900px) {
  .member-sidebar {
    display: none;
  }

  .channel-sidebar {
    width: 210px;
  }

  .server-bar {
    width: 62px;
  }
}

@media(max-width:650px) {
  .channel-sidebar {
    display: none;
  }

  .server-bar {
    width: 58px;
  }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginScreen">

  <div class="login-card">

    <div class="login-logo">
      N
    </div>

    <h1>Bienvenue sur NovaChat</h1>

    <p>
      Connecte-toi pour commencer à discuter.
    </p>

    <input
      id="usernameInput"
      class="login-input"
      maxlength="24"
      placeholder="Nom d'utilisateur"
      autocomplete="off"
    >

    <button
      id="loginButton"
      class="login-button"
    >
      Entrer dans NovaChat
    </button>

    <div id="loginStatus"></div>

  </div>

</div>

<!-- =========================
     APPLICATION
========================= -->

<div id="app" class="hidden">

  <!-- SERVERS -->

  <aside class="server-bar" id="serverBar">

    <button
      class="server active"
      id="homeButton"
      title="Accueil"
    >
      N
    </button>

    <div id="serverButtons"></div>

    <div class="server-separator"></div>

    <button
      class="server add"
      id="createServerButton"
      title="Créer un serveur"
    >
      +
    </button>

    <button
      class="server add"
      id="joinServerButton"
      title="Rejoindre un serveur"
    >
      ↗
    </button>

  </aside>

  <!-- CHANNELS -->

  <aside class="channel-sidebar">

    <div class="server-header">

      <span id="currentServerName">
        Nova Lounge
      </span>

      <button id="serverMenuButton">
        ▾
      </button>

    </div>

    <div class="channel-list">

      <div class="category">
        <span>TEXTUEL</span>

        <button id="addTextChannel">
          +
        </button>
      </div>

      <div id="textChannels"></div>

      <div class="category">
        <span>VOCAL</span>

        <button id="addVoiceChannel">
          +
        </button>
      </div>

      <div id="voiceChannels"></div>

    </div>

    <!-- USER -->

    <div class="user-box">

      <div class="avatar" id="myAvatar">
        ?
        <span class="presence"></span>
      </div>

      <div class="user-info">

        <strong id="myName">
          Utilisateur
        </strong>

        <small>
          En ligne
        </small>

      </div>

      <div class="user-actions">

        <button
          class="small-btn"
          id="muteQuickButton"
          title="Micro"
        >
          🎤
        </button>

        <button
          class="small-btn"
          id="settingsButton"
          title="Paramètres"
        >
          ⚙
        </button>

      </div>

    </div>

  </aside>

  <!-- CHAT -->

  <main class="chat">

    <header class="chat-header">

      <div class="hash">
        #
      </div>

      <div>

        <div
          class="chat-name"
          id="chatName"
        >
          général
        </div>

        <div
          class="chat-description"
          id="chatDescription"
        >
          Discutez avec les membres.
        </div>

      </div>

      <div class="header-spacer"></div>

      <button
        class="header-button"
        id="friendsButton"
        title="Amis"
      >
        👥
      </button>

      <button
        class="header-button"
        id="memberButton"
        title="Membres"
      >
        ☷
      </button>

      <button
        class="header-button"
        id="searchButton"
        title="Rechercher"
      >
        🔎
      </button>

    </header>

    <!-- MESSAGE AREA -->

    <div
      class="messages"
      id="messages"
    ></div>

    <!-- COMPOSER -->

    <div class="composer-area">

      <div class="composer">

        <button
          id="emojiButton"
          title="Emoji"
        >
          🙂
        </button>

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Écrire un message..."
        ></textarea>

        <button
          id="sendButton"
          title="Envoyer"
        >
          ➤
        </button>

      </div>

    </div>

  </main>

  <!-- MEMBERS -->

  <aside class="member-sidebar">

    <div class="member-title">
      MEMBRES
    </div>

    <div id="memberList"></div>

  </aside>

</div>

<!-- =========================
     VOICE PANEL
========================= -->

<div
  id="voicePanel"
  class="voice-panel hidden"
>

  <div class="voice-top">

    <div>

      <div class="voice-room" id="voiceRoomName">
        Salon vocal
      </div>

      <div class="voice-connected">
        Connecté
      </div>

    </div>

    <button
      class="small-btn"
      id="leaveVoiceButton"
      title="Quitter"
    >
      ☎
    </button>

  </div>

  <div
    class="voice-users"
    id="voiceUsers"
  ></div>

  <div class="voice-controls">

    <button
      class="voice-control active"
      id="muteButton"
      title="Micro"
    >
      🎤
    </button>

    <button
      class="voice-control"
      id="cameraButton"
      title="Caméra"
    >
      📹
    </button>

    <button
      class="voice-control"
      id="screenButton"
      title="Partager l'écran"
    >
      🖥️
    </button>

  </div>

</div>

<!-- VIDEOS -->

<div
  id="videoGrid"
  class="video-grid hidden"
></div>

<!-- =========================
     FRIENDS MODAL
========================= -->

<div
  id="friendsModal"
  class="modal hidden"
>

  <div class="modal-box">

    <h2>👥 Amis</h2>

    <label class="modal-label">
      Ajouter un ami avec son ID
    </label>

    <input
      id="friendIdInput"
      class="modal-input"
      placeholder="ID utilisateur"
    >

    <div
      id="friendList"
      class="friend-list"
    ></div>

    <div class="modal-actions">

      <button
        class="modal-button"
        data-close="friendsModal"
      >
        Fermer
      </button>

    </div>

  </div>

</div>

<!-- =========================
     CREATE SERVER
========================= -->

<div
  id="createServerModal"
  class="modal hidden"
>

  <div class="modal-box">

    <h2>Créer un serveur</h2>

    <label class="modal-label">
      Nom du serveur
    </label>

    <input
      id="serverNameInput"
      class="modal-input"
      maxlength="50"
      placeholder="Mon serveur"
    >

    <div class="modal-actions">

      <button
        class="modal-button"
        data-close="createServerModal"
      >
        Annuler
      </button>

      <button
        class="modal-button primary"
        id="confirmCreateServer"
      >
        Créer
      </button>

    </div>

  </div>

</div>

<!-- =========================
     JOIN SERVER
========================= -->

<div
  id="joinServerModal"
  class="modal hidden"
>

  <div class="modal-box">

    <h2>Rejoindre un serveur</h2>

    <p style="color:var(--muted)">
      Entre le code d'invitation du serveur.
    </p>

    <label class="modal-label">
      Code d'invitation
    </label>

    <input
      id="inviteInput"
      class="modal-input"
      placeholder="XXXX-XXXX"
    >

    <div class="modal-actions">

      <button
        class="modal-button"
        data-close="joinServerModal"
      >
        Annuler
      </button>

      <button
        class="modal-button primary"
        id="confirmJoinServer"
      >
        Rejoindre
      </button>

    </div>

  </div>

</div>

<!-- =========================
     SETTINGS
========================= -->

<div
  id="settingsModal"
  class="modal hidden"
>

  <div class="modal-box">

    <h2>⚙ Paramètres</h2>

    <label class="modal-label">
      Nom d'utilisateur
    </label>

    <input
      id="settingsUsername"
      class="modal-input"
    >

    <label class="modal-label">
      Micro
    </label>

    <select
      id="audioInput"
      class="modal-select"
    ></select>

    <label class="modal-label">
      Sortie audio
    </label>

    <select
      id="audioOutput"
      class="modal-select"
    ></select>

    <label class="modal-label">
      Volume
    </label>

    <input
      id="volumeSlider"
      type="range"
      min="0"
      max="100"
      value="100"
      style="width:100%"
    >

    <div class="modal-actions">

      <button
        class="modal-button"
        data-close="settingsModal"
      >
        Fermer
      </button>

      <button
        class="modal-button primary"
        id="saveSettings"
      >
        Enregistrer
      </button>

    </div>

  </div>

</div>

<script>
/* =========================================================
   NOVACHAT CLIENT
========================================================= */

const socket = io({
  autoConnect: false
});

let currentUser = null;
let currentServer = null;
let currentChannel = null;

let localStream = null;
let localScreenStream = null;

const peerConnections = new Map();

let isMuted = false;
let cameraEnabled = false;
let screenSharing = false;

const iceConfig = {
  iceServers: [
    {
      urls: "stun:stun.l.google.com:19302"
    },
    {
      urls: "stun:stun1.l.google.com:19302"
    }
  ]
};

/* =========================================================
   ELEMENTS
========================================================= */

const $ = id => document.getElementById(id);

const loginScreen = $("loginScreen");
const app = $("app");

const usernameInput = $("usernameInput");
const loginButton = $("loginButton");
const loginStatus = $("loginStatus");

const messages = $("messages");
const messageInput = $("messageInput");
const sendButton = $("sendButton");

const textChannels = $("textChannels");
const voiceChannels = $("voiceChannels");

const memberList = $("memberList");
const serverButtons = $("serverButtons");

const currentServerName = $("currentServerName");
const chatName = $("chatName");

const voicePanel = $("voicePanel");
const voiceUsers = $("voiceUsers");
const voiceRoomName = $("voiceRoomName");

const videoGrid = $("videoGrid");

/* =========================================================
   LOGIN
========================================================= */

loginButton.addEventListener("click", login);

usernameInput.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    login();
  }
});

async function login() {

  const username = usernameInput.value.trim();

  if (!username) {
    loginStatus.textContent = "Entre un nom d'utilisateur.";
    return;
  }

  loginButton.disabled = true;
  loginStatus.textContent = "Connexion au serveur...";

  try {

    const response = await fetch("/api/users", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        username
      })
    });

    if (!response.ok) {
      throw new Error("Impossible de créer l'utilisateur.");
    }

    currentUser = await response.json();

    socket.connect();

  } catch (error) {

    console.error(error);

    loginStatus.textContent =
      "Impossible de se connecter au serveur.";

    loginButton.disabled = false;
  }
}

/* =========================================================
   SOCKET CONNECTION
========================================================= */

socket.on("connect", async () => {

  console.log("Socket connecté :", socket.id);

  if (!currentUser) return;

  socket.emit("register", currentUser.id);

  loginScreen.classList.add("hidden");
  app.classList.remove("hidden");

  $("myName").textContent = currentUser.username;
  $("myAvatar").firstChild.textContent =
    currentUser.username.charAt(0).toUpperCase();

  await loadServers();
});

socket.on("connect_error", error => {

  console.error("Socket error :", error);

  loginStatus.textContent =
    "Connexion au serveur perdue.";

  loginButton.disabled = false;
});

socket.on("disconnect", reason => {

  console.log("Socket déconnecté :", reason);

  if (!currentUser) return;

  // On ne remet pas l'écran de login,
  // car Socket.IO essaiera de se reconnecter.
});

/* =========================================================
   SERVERS
========================================================= */

async function loadServers() {

  const response = await fetch("/api/servers");

  const servers = await response.json();

  serverButtons.innerHTML = "";

  for (const server of servers) {

    if (
      server.ownerId === "system" ||
      server.memberCount > 0
    ) {

      const button = document.createElement("button");

      button.className = "server";

      button.textContent =
        server.name.charAt(0).toUpperCase();

      button.title = server.name;

      button.addEventListener("click", () => {
        selectServer(server);
      });

      serverButtons.appendChild(button);
    }
  }

  if (servers.length > 0) {

    let selected =
      servers.find(s =>
        s.id === "novalounge"
      );

    if (!selected) {
      selected = servers[0];
    }

    selectServer(selected);
  }
}

async function selectServer(server) {

  currentServer = server;

  currentServerName.textContent =
    server.name;

  socket.emit("joinServer", server.id);

  renderChannels(server);

  await loadMembers(server.id);

  const firstText =
    server.channels.find(c =>
      c.type === "text"
    );

  if (firstText) {
    selectChannel(firstText);
  }
}

function renderChannels(server) {

  textChannels.innerHTML = "";
  voiceChannels.innerHTML = "";

  for (const channel of server.channels) {

    const button = document.createElement("button");

    button.className = "channel";

    if (channel.type === "text") {

      button.innerHTML = `
        <span class="channel-icon">#</span>
        <span>${escapeHtml(channel.name)}</span>
      `;

      button.addEventListener("click", () => {
        selectChannel(channel);
      });

      textChannels.appendChild(button);

    } else {

      button.innerHTML = `
        <span class="channel-icon">◉</span>
        <span>${escapeHtml(channel.name)}</span>
        <span class="voice-count"
              id="count-${channel.id}">
          0
        </span>
      `;

      button.addEventListener("click", () => {
        joinVoice(channel);
      });

      voiceChannels.appendChild(button);
    }
  }
}

/* =========================================================
   CHANNELS
========================================================= */

async function selectChannel(channel) {

  currentChannel = channel;

  chatName.textContent =
    channel.name;

  await loadMessages(channel.id);
}

async function loadMessages(channelId) {

  messages.innerHTML = "";

  try {

    const response =
      await fetch(`/api/messages/${channelId}`);

    const data = await response.json();

    for (const message of data) {
      addMessage(message);
    }

  } catch (error) {

    console.error(error);
  }

  scrollMessages();
}

function addMessage(message) {

  const element =
    document.createElement("div");

  element.className = "message";

  const initial =
    (message.username || "?")
      .charAt(0)
      .toUpperCase();

  const date =
    new Date(message.createdAt);

  element.innerHTML = `
    <div class="message-avatar">
      ${escapeHtml(initial)}
    </div>

    <div class="message-content">

      <div>
        <span class="message-author">
          ${escapeHtml(message.username)}
        </span>

        <span class="message-time">
          ${date.toLocaleString()}
        </span>
      </div>

      <div class="message-text">
        ${escapeHtml(message.content)}
      </div>

    </div>
  `;

  messages.appendChild(element);
}

/* =========================================================
   SEND MESSAGE
========================================================= */

sendButton.addEventListener(
  "click",
  sendMessage
);

messageInput.addEventListener(
  "keydown",
  e => {

    if (
      e.key === "Enter" &&
      !e.shiftKey
    ) {

      e.preventDefault();

      sendMessage();
    }
  }
);

async function sendMessage() {

  if (!currentUser) return;
  if (!currentChannel) return;

  const content =
    messageInput.value.trim();

  if (!content) return;

  messageInput.value = "";

  try {

    await fetch("/api/messages", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        channelId: currentChannel.id,
        userId: currentUser.id,
        content
      })

    });

  } catch (error) {

    console.error(error);
  }
}

socket.on("newMessage", message => {

  if (
    currentChannel &&
    message.channelId === currentChannel.id
  ) {

    addMessage(message);

    scrollMessages();
  }
});

function scrollMessages() {

  messages.scrollTop =
    messages.scrollHeight;
}

/* =========================================================
   MEMBERS
========================================================= */

async function loadMembers(serverId) {

  const response =
    await fetch(
      `/api/servers/${serverId}/members`
    );

  const members =
    await response.json();

  memberList.innerHTML = "";

  for (const user of members) {

    addMember(user);
  }
}

function addMember(user) {

  const item =
    document.createElement("div");

  item.className = "member";

  const initial =
    user.username.charAt(0).toUpperCase();

  item.innerHTML = `
    <div class="member-avatar">
      ${escapeHtml(initial)}
    </div>

    <div>
      <div class="member-name">
        ${escapeHtml(user.username)}
      </div>

      <div class="member-status">
        ${user.status === "online"
          ? "En ligne"
          : "Hors ligne"}
      </div>
    </div>
  `;

  memberList.appendChild(item);
}

socket.on("serverMemberJoined", data => {

  if (
    currentServer &&
    currentServer.id === data.serverId
  ) {

    loadMembers(data.serverId);
  }
});

socket.on("userStatus", data => {

  if (currentServer) {
    loadMembers(currentServer.id);
  }
});

/* =========================================================
   CREATE SERVER
========================================================= */

$("createServerButton")
  .addEventListener("click", () => {

    $("createServerModal")
      .classList.remove("hidden");

    $("serverNameInput").focus();
  });

$("confirmCreateServer")
  .addEventListener("click", async () => {

    const name =
      $("serverNameInput").value.trim();

    if (!name) return;

    const response =
      await fetch("/api/servers", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          name,
          ownerId: currentUser.id
        })
      });

    if (!response.ok) {
      alert("Impossible de créer le serveur.");
      return;
    }

    const server =
      await response.json();

    $("createServerModal")
      .classList.add("hidden");

    $("serverNameInput").value = "";

    await loadServers();

    selectServer(server);
  });

/* =========================================================
   JOIN SERVER
========================================================= */

$("joinServerButton")
  .addEventListener("click", () => {

    $("joinServerModal")
      .classList.remove("hidden");

    $("inviteInput").focus();
  });

$("confirmJoinServer")
  .addEventListener("click", async () => {

    const inviteCode =
      $("inviteInput").value.trim();

    if (!inviteCode) return;

    const response =
      await fetch("/api/servers/join", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          inviteCode,
          userId: currentUser.id
        })
      });

    const data =
      await response.json();

    if (!response.ok) {

      alert(data.error || "Invitation invalide.");

      return;
    }

    $("joinServerModal")
      .classList.add("hidden");

    $("inviteInput").value = "";

    await loadServers();

    selectServer(data.server);
  });

/* =========================================================
   VOICE
========================================================= */

async function joinVoice(channel) {

  if (!currentServer) return;

  try {

    await startMicrophone();

    voicePanel.classList.remove("hidden");

    voiceRoomName.textContent =
      channel.name;

    socket.emit("joinVoice", {

      serverId: currentServer.id,

      roomId: channel.id
    });

  } catch (error) {

    console.error(error);

    alert(
      "Impossible d'accéder au microphone. Vérifie les permissions du navigateur."
    );
  }
}

async function startMicrophone() {

  if (localStream) return;

  localStream =
    await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: false
    });
}

$("leaveVoiceButton")
  .addEventListener("click", leaveVoice);

function leaveVoice() {

  socket.emit("leaveVoice");

  if (localStream) {

    localStream
      .getTracks()
      .forEach(track => track.stop());

    localStream = null;
  }

  if (localScreenStream) {

    localScreenStream
      .getTracks()
      .forEach(track => track.stop());

    localScreenStream = null;
  }

  for (const pc of peerConnections.values()) {
    pc.close();
  }

  peerConnections.clear();

  voicePanel.classList.add("hidden");

  videoGrid.classList.add("hidden");

  videoGrid.innerHTML = "";
}

/* =========================================================
   VOICE USERS
========================================================= */

socket.on("voiceUsers", async data => {

  voiceUsers.innerHTML = "";

  for (const userId of data.users) {

    addVoiceUser(userId);

    await createOfferForUser(userId);
  }
});

socket.on("voiceUserJoined", async data => {

  addVoiceUser(data.userId);

  await createOfferForUser(data.userId);
});

socket.on("voiceUserLeft", data => {

  removeVoiceUser(data.userId);

  closePeer(data.userId);
});

function addVoiceUser(userId) {

  if (
    document.querySelector(
      `[data-voice-user="${userId}"]`
    )
  ) {
    return;
  }

  const element =
    document.createElement("div");

  element.className = "voice-user";

  element.dataset.voiceUser = userId;

  element.textContent =
    "Utilisateur";

  voiceUsers.appendChild(element);
}

function removeVoiceUser(userId) {

  const element =
    document.querySelector(
      `[data-voice-user="${userId}"]`
    );

  if (element) {
    element.remove();
  }
}

/* =========================================================
   WEBRTC
========================================================= */

async function createPeer(userId) {

  if (peerConnections.has(userId)) {
    return peerConnections.get(userId);
  }

  const pc =
    new RTCPeerConnection(iceConfig);

  peerConnections.set(userId, pc);

  if (localStream) {

    for (
      const track
      of localStream.getTracks()
    ) {

      pc.addTrack(
        track,
        localStream
      );
    }
  }

  pc.onicecandidate = event => {

    if (!event.candidate) return;

    socket.emit(
      "webrtcIceCandidate",
      {
        target: userId,
        candidate: event.candidate
      }
    );
  };

  pc.ontrack = event => {

    const stream =
      event.streams[0];

    if (stream) {
      addRemoteStream(
        userId,
        stream
      );
    }
  };

  pc.onconnectionstatechange = () => {

    if (
      pc.connectionState === "failed" ||
      pc.connectionState === "closed" ||
      pc.connectionState === "disconnected"
    ) {

      closePeer(userId);
    }
  };

  return pc;
}

async function createOfferForUser(userId) {

  try {

    const pc =
      await createPeer(userId);

    const offer =
      await pc.createOffer();

    await pc.setLocalDescription(offer);

    socket.emit(
      "webrtcOffer",
      {
        target: userId,
        offer
      }
    );

  } catch (error) {

    console.error(
      "Offer WebRTC:",
      error
    );
  }
}

socket.on(
  "webrtcOffer",
  async data => {

    try {

      const pc =
        await createPeer(data.from);

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.offer
        )
      );

      const answer =
        await pc.createAnswer();

      await pc.setLocalDescription(
        answer
      );

      socket.emit(
        "webrtcAnswer",
        {
          target: data.from,
          answer
        }
      );

    } catch (error) {

      console.error(
        "Offer reçue:",
        error
      );
    }
  }
);

socket.on(
  "webrtcAnswer",
  async data => {

    try {

      const pc =
        peerConnections.get(
          data.from
        );

      if (!pc) return;

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.answer
        )
      );

    } catch (error) {

      console.error(
        "Answer:",
        error
      );
    }
  }
);

socket.on(
  "webrtcIceCandidate",
  async data => {

    try {

      const pc =
        await createPeer(data.from);

      await pc.addIceCandidate(
        new RTCIceCandidate(
          data.candidate
        )
      );

    } catch (error) {

      console.error(
        "ICE:",
        error
      );
    }
  }
);

/* =========================================================
   CAMERA
========================================================= */

$("cameraButton")
  .addEventListener(
    "click",
    toggleCamera
  );

async function toggleCamera() {

  if (!localStream) {

    await startMicrophone();
  }

  if (!cameraEnabled) {

    try {

      const cameraStream =
        await navigator.mediaDevices
          .getUserMedia({
            audio: true,
            video: true
          });

      const videoTrack =
        cameraStream.getVideoTracks()[0];

      localStream.addTrack(
        videoTrack
      );

      cameraEnabled = true;

      $("cameraButton")
        .classList.add("active");

      updatePeerTracks();

    } catch (error) {

      console.error(error);

      alert(
        "Impossible d'accéder à la caméra."
      );
    }

  } else {

    const tracks =
      localStream.getVideoTracks();

    tracks.forEach(track => {

      track.stop();

      localStream.removeTrack(
        track
      );
    });

    cameraEnabled = false;

    $("cameraButton")
      .classList.remove("active");

    updatePeerTracks();
  }
}

/* =========================================================
   SCREEN SHARE
========================================================= */

$("screenButton")
  .addEventListener(
    "click",
    toggleScreen
  );

async function toggleScreen() {

  if (!screenSharing) {

    try {

      localScreenStream =
        await navigator.mediaDevices
          .getDisplayMedia({
            video: true,
            audio: true
          });

      const track =
        localScreenStream
          .getVideoTracks()[0];

      track.onended = () => {

        stopScreenShare();
      };

      for (
        const pc
        of peerConnections.values()
      ) {

        const sender =
          pc.getSenders()
            .find(
              s =>
                s.track &&
                s.track.kind === "video"
            );

        if (sender) {

          await sender.replaceTrack(
            track
          );
        } else {

          pc.addTrack(
            track,
            localScreenStream
          );
        }
      }

      screenSharing = true;

      $("screenButton")
        .classList.add("active");

    } catch (error) {

      console.error(error);
    }

  } else {

    stopScreenShare();
  }
}

function stopScreenShare() {

  if (localScreenStream) {

    localScreenStream
      .getTracks()
      .forEach(track =>
        track.stop()
      );

    localScreenStream = null;
  }

  screenSharing = false;

  $("screenButton")
    .classList.remove("active");

  updatePeerTracks();
}

/* =========================================================
   MICROPHONE
========================================================= */

$("muteButton")
  .addEventListener(
    "click",
    toggleMute
  );

$("muteQuickButton")
  .addEventListener(
    "click",
    toggleMute
  );

function toggleMute() {

  if (!localStream) return;

  const audioTracks =
    localStream.getAudioTracks();

  if (!audioTracks.length) return;

  isMuted = !isMuted;

  for (const track of audioTracks) {
    track.enabled = !isMuted;
  }

  $("muteButton").classList.toggle(
    "active",
    !isMuted
  );

  $("muteQuickButton").textContent =
    isMuted ? "🔇" : "🎤";
}

/* =========================================================
   PEER TRACK UPDATE
========================================================= */

function updatePeerTracks() {

  for (
    const [userId, pc]
    of peerConnections
  ) {

    const senders =
      pc.getSenders();

    const audioTrack =
      localStream?.getAudioTracks()[0];

    const videoTrack =
      localStream?.getVideoTracks()[0];

    const audioSender =
      senders.find(
        s =>
          s.track &&
          s.track.kind === "audio"
      );

    const videoSender =
      senders.find(
        s =>
          s.track &&
          s.track.kind === "video"
      );

    if (
      audioSender &&
      audioTrack
    ) {

      audioSender.replaceTrack(
        audioTrack
      );
    }

    if (
      videoSender &&
      videoTrack
    ) {

      videoSender.replaceTrack(
        videoTrack
      );
    }
  }
}

/* =========================================================
   VIDEO
========================================================= */

function addRemoteStream(
  userId,
  stream
) {

  let tile =
    document.querySelector(
      `[data-video-user="${userId}"]`
    );

  if (!tile) {

    tile =
      document.createElement("div");

    tile.className =
      "video-tile";

    tile.dataset.videoUser =
      userId;

    const video =
      document.createElement("video");

    video.autoplay = true;
    video.playsInline = true;

    const name =
      document.createElement("div");

    name.className =
      "video-name";

    name.textContent =
      "Utilisateur";

    tile.appendChild(video);
    tile.appendChild(name);

    videoGrid.appendChild(tile);
  }

  const video =
    tile.querySelector("video");

  video.srcObject = stream;

  videoGrid.classList.remove(
    "hidden"
  );
}

function closePeer(userId) {

  const pc =
    peerConnections.get(userId);

  if (pc) {
    pc.close();
  }

  peerConnections.delete(userId);

  const tile =
    document.querySelector(
      `[data-video-user="${userId}"]`
    );

  if (tile) {
    tile.remove();
  }

  if (
    videoGrid.children.length === 0
  ) {

    videoGrid.classList.add(
      "hidden"
    );
  }
}

/* =========================================================
   EMOJI
========================================================= */

$("emojiButton")
  .addEventListener(
    "click",
    () => {

      const emojis =
        [
          "😀",
          "😂",
          "😍",
          "😎",
          "🔥",
          "❤️",
          "👍",
          "👎",
          "🎉",
          "🚀",
          "💀",
          "😭"
        ];

      const emoji =
        emojis[
          Math.floor(
            Math.random() *
            emojis.length
          )
        ];

      messageInput.value += emoji;

      messageInput.focus();
    }
  );

/* =========================================================
   SETTINGS
========================================================= */

$("settingsButton")
  .addEventListener(
    "click",
    openSettings
  );

async function openSettings() {

  $("settingsUsername").value =
    currentUser.username;

  $("settingsModal")
    .classList.remove("hidden");

  await loadAudioDevices();
}

async function loadAudioDevices() {

  try {

    await navigator.mediaDevices
      .getUserMedia({
        audio: true
      });

    const devices =
      await navigator.mediaDevices
        .enumerateDevices();

    const inputs =
      devices.filter(
        d => d.kind === "audioinput"
      );

    const outputs =
      devices.filter(
        d => d.kind === "audiooutput"
      );

    $("audioInput").innerHTML = "";

    $("audioOutput").innerHTML = "";

    inputs.forEach(device => {

      const option =
        document.createElement("option");

      option.value =
        device.deviceId;

      option.textContent =
        device.label ||
        "Microphone";

      $("audioInput")
        .appendChild(option);
    });

    outputs.forEach(device => {

      const option =
        document.createElement("option");

      option.value =
        device.deviceId;

      option.textContent =
        device.label ||
        "Haut-parleur";

      $("audioOutput")
        .appendChild(option);
    });

  } catch (error) {

    console.error(
      "Audio devices:",
      error
    );
  }
}

$("saveSettings")
  .addEventListener(
    "click",
    async () => {

      const username =
        $("settingsUsername")
          .value.trim();

      if (username) {

        currentUser.username =
          username;

        $("myName").textContent =
          username;

        $("myAvatar")
          .firstChild.textContent =
            username
              .charAt(0)
              .toUpperCase();
      }

      const volume =
        Number(
          $("volumeSlider").value
        ) / 100;

      document
        .querySelectorAll(
          "audio, video"
        )
        .forEach(element => {
          element.volume = volume;
        });

      const output =
        $("audioOutput").value;

      if (
        output &&
        typeof HTMLMediaElement
          .prototype.setSinkId ===
          "function"
      ) {

        document
          .querySelectorAll(
            "audio, video"
          )
          .forEach(element => {

            element.setSinkId(
              output
            ).catch(() => {});
          });
      }

      $("settingsModal")
        .classList.add("hidden");
    }
  );

/* =========================================================
   FRIENDS
========================================================= */

$("friendsButton")
  .addEventListener(
    "click",
    () => {

      $("friendsModal")
        .classList.remove("hidden");
    }
  );

/* =========================================================
   CLOSE MODALS
========================================================= */

document
  .querySelectorAll(
    "[data-close]"
  )
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        const id =
          button.dataset.close;

        $(id)
          .classList.add("hidden");
      }
    );
  });

document
  .querySelectorAll(".modal")
  .forEach(modal => {

    modal.addEventListener(
      "click",
      e => {

        if (
          e.target === modal
        ) {

          modal.classList.add(
            "hidden"
          );
        }
      }
    );
  });

/* =========================================================
   HOME
========================================================= */

$("homeButton")
  .addEventListener(
    "click",
    async () => {

      await loadServers();
    }
  );

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

/* =========================================================
   RECONNECTION
========================================================= */

socket.io.on(
  "reconnect_attempt",
  () => {

    console.log(
      "Tentative de reconnexion..."
    );
  }
);

socket.io.on(
  "reconnect",
  () => {

    console.log(
      "Reconnecté au serveur."
    );

    if (currentUser) {

      socket.emit(
        "register",
        currentUser.id
      );
    }
  }
);
</script>
