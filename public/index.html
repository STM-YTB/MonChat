<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NovaChat</title>

<script src="/socket.io/socket.io.js"></script>

<style>

:root {
  --bg: #1e1f22;
  --bg-dark: #111214;
  --sidebar: #2b2d31;
  --sidebar-light: #313338;
  --hover: #3f4147;
  --active: #404249;
  --text: #f2f3f5;
  --muted: #949ba4;
  --accent: #5865f2;
  --success: #23a559;
  --danger: #ed4245;
  --border: #202225;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

button,
input,
textarea {
  font: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* =========================================================
   LOGIN
========================================================= */

#loginScreen {
  position: fixed;
  inset: 0;
  z-index: 1000;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      circle at 50% 0%,
      #42458a 0,
      transparent 45%
    ),
    #111214;
}

.auth-box {
  width: 430px;
  padding: 34px;

  background: #313338;
  border-radius: 8px;

  box-shadow:
    0 25px 80px rgba(0,0,0,.55);
}

.auth-box h1 {
  margin: 0 0 8px;
  text-align: center;
}

.auth-subtitle {
  color: var(--muted);
  text-align: center;
  margin-bottom: 24px;
}

.auth-box label {
  display: block;
  margin: 15px 0 7px;

  color: #b5bac1;

  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
}

.auth-box input {
  width: 100%;

  padding: 12px;

  border: 1px solid #1e1f22;
  border-radius: 4px;

  outline: none;

  background: #1e1f22;
  color: white;
}

.auth-box input:focus {
  border-color: var(--accent);
}

.auth-button {
  width: 100%;

  margin-top: 20px;
  padding: 13px;

  border-radius: 4px;

  background: var(--accent);
  color: white;

  font-weight: 700;
}

.auth-button:hover {
  background: #4752c4;
}

.auth-switch {
  margin-top: 18px;

  color: var(--muted);

  text-align: center;
  font-size: 13px;
}

.auth-switch button {
  background: transparent;
  color: #00a8fc;
}

.form-error {
  margin-top: 10px;
  color: #fa777c;
  font-size: 13px;
}

/* =========================================================
   APP
========================================================= */

#app {
  height: 100vh;

  display: flex;
}

/* =========================================================
   SERVER BAR
========================================================= */

.server-bar {
  width: 72px;
  flex-shrink: 0;

  padding: 12px 10px;

  overflow-y: auto;

  background: #1e1f22;
}

.server-icon {
  width: 52px;
  height: 52px;

  margin-bottom: 8px;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  background: #313338;
  color: white;

  font-size: 17px;
  font-weight: bold;

  transition:
    border-radius .15s,
    background .15s;
}

.server-icon:hover {
  border-radius: 16px;
  background: var(--accent);
}

.server-icon.active {
  border-radius: 16px;
  background: var(--accent);
}

.server-icon img {
  width: 100%;
  height: 100%;

  object-fit: cover;
}

.server-separator {
  height: 2px;

  margin: 7px 5px 12px;

  background: #35373c;
}

/* =========================================================
   CHANNEL SIDEBAR
========================================================= */

.channel-sidebar {
  width: 250px;
  flex-shrink: 0;

  display: flex;
  flex-direction: column;

  background: var(--sidebar);
}

.server-header {
  height: 56px;

  padding: 0 14px;

  display: flex;
  align-items: center;

  border-bottom: 1px solid var(--border);

  font-weight: bold;
}

.server-header-text {
  min-width: 0;
  flex: 1;
}

.server-header-name {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.server-header-code {
  margin-top: 2px;

  color: var(--muted);

  font-size: 10px;
}

.channel-scroll {
  flex: 1;

  padding: 10px;

  overflow-y: auto;
}

.category {
  margin: 17px 5px 7px;

  display: flex;
  align-items: center;

  color: var(--muted);

  font-size: 11px;
  font-weight: bold;

  text-transform: uppercase;
}

.category-title {
  flex: 1;
}

.category button {
  width: 22px;
  height: 22px;

  border-radius: 4px;

  background: transparent;
  color: var(--muted);
}

.category button:hover {
  background: var(--hover);
  color: white;
}

.channel {
  width: 100%;

  padding: 8px;

  margin-bottom: 2px;

  display: flex;
  align-items: center;

  gap: 8px;

  border-radius: 4px;

  background: transparent;
  color: #b5bac1;

  text-align: left;
}

.channel:hover,
.channel.active {
  background: var(--hover);
  color: white;
}

.channel-icon {
  width: 20px;

  color: var(--muted);

  text-align: center;

  font-size: 17px;
}

.channel-name {
  flex: 1;
}

.voice-users {
  padding: 2px 0 5px 31px;
}

.voice-user {
  padding: 5px 4px;

  display: flex;
  align-items: center;

  gap: 8px;

  border-radius: 4px;

  color: #b5bac1;

  font-size: 12px;
}

.voice-user:hover {
  background: var(--hover);
  color: white;
}

.voice-user-avatar {
  width: 26px;
  height: 26px;

  flex-shrink: 0;

  border-radius: 50%;

  overflow: hidden;

  display: flex;
  align-items: center;
  justify-content: center;

  background: var(--accent);

  color: white;

  font-size: 11px;
  font-weight: bold;
}

.voice-user-avatar img {
  width: 100%;
  height: 100%;

  object-fit: cover;
}

.voice-user-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* =========================================================
   USER BOX
========================================================= */

.user-box {
  height: 60px;

  padding: 8px;

  display: flex;
  align-items: center;

  gap: 9px;

  background: #232428;
}

.user-avatar {
  width: 34px;
  height: 34px;

  flex-shrink: 0;

  border-radius: 50%;

  overflow: hidden;

  display: flex;
  align-items: center;
  justify-content: center;

  background: var(--accent);

  font-weight: bold;
}

.user-avatar img {
  width: 100%;
  height: 100%;

  object-fit: cover;
}

.user-info {
  flex: 1;

  min-width: 0;
}

.user-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;

  font-weight: bold;
}

.user-status {
  color: var(--success);
  font-size: 11px;
}

.user-settings-button {
  background: transparent;
  color: #b5bac1;

  font-size: 18px;
}

/* =========================================================
   HOME / FRIEND SIDEBAR
========================================================= */

.home-sidebar {
  width: 250px;
  flex-shrink: 0;

  display: flex;
  flex-direction: column;

  background: var(--sidebar);
}

.home-header {
  height: 56px;

  padding: 0 15px;

  display: flex;
  align-items: center;

  border-bottom: 1px solid var(--border);

  font-weight: bold;
}

.home-scroll {
  flex: 1;

  padding: 10px;

  overflow-y: auto;
}

.home-button {
  width: 100%;

  margin-bottom: 4px;
  padding: 10px;

  border-radius: 4px;

  background: transparent;
  color: #b5bac1;

  text-align: left;
}

.home-button:hover,
.home-button.active {
  background: var(--hover);
  color: white;
}

.friend-item {
  width: 100%;

  padding: 8px;

  margin-bottom: 2px;

  display: flex;
  align-items: center;

  gap: 9px;

  border-radius: 4px;

  cursor: pointer;
}

.friend-item:hover,
.friend-item.active {
  background: var(--hover);
}

.friend-avatar {
  width: 34px;
  height: 34px;

  flex-shrink: 0;

  border-radius: 50%;

  overflow: hidden;

  display: flex;
  align-items: center;
  justify-content: center;

  background: var(--accent);

  font-size: 12px;
  font-weight: bold;
}

.friend-avatar img {
  width: 100%;
  height: 100%;

  object-fit: cover;
}

.friend-info {
  min-width: 0;
}

.friend-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.friend-status {
  color: var(--muted);
  font-size: 11px;
}

/* =========================================================
   MAIN CHAT
========================================================= */

.main {
  flex: 1;

  min-width: 0;

  display: flex;
  flex-direction: column;
}

.topbar {
  height: 56px;

  padding: 0 18px;

  display: flex;
  align-items: center;

  gap: 10px;

  background: var(--sidebar-light);

  border-bottom: 1px solid var(--border);
}

.topbar-icon {
  color: var(--muted);
  font-size: 20px;
}

.topbar-title {
  font-weight: bold;
}

.topbar-description {
  margin-top: 2px;

  color: var(--muted);

  font-size: 11px;
}

.topbar-spacer {
  flex: 1;
}

.topbar-button {
  width: 36px;
  height: 36px;

  border-radius: 4px;

  background: transparent;
  color: #b5bac1;

  font-size: 18px;
}

.topbar-button:hover {
  background: var(--hover);
  color: white;
}

.messages {
  flex: 1;

  padding: 20px;

  overflow-y: auto;
}

.message {
  display: flex;

  gap: 11px;

  margin-bottom: 17px;
}

.message-avatar {
  width: 40px;
  height: 40px;

  flex-shrink: 0;

  overflow: hidden;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  background: var(--accent);

  font-weight: bold;
}

.message-avatar img {
  width: 100%;
  height: 100%;

  object-fit: cover;
}

.message-content-wrapper {
  min-width: 0;
}

.message-header {
  display: flex;
  align-items: baseline;

  gap: 7px;
}

.message-author {
  font-weight: bold;
}

.message-time {
  color: var(--muted);
  font-size: 10px;
}

.message-text {
  margin-top: 3px;

  color: #dbdee1;

  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.empty {
  height: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  color: var(--muted);

  text-align: center;
}

.composer {
  padding: 0 20px 20px;
}

.composer-inner {
  display: flex;
  align-items: flex-end;

  padding: 7px;

  background: #383a40;

  border-radius: 8px;
}

.composer textarea {
  flex: 1;

  max-height: 140px;

  padding: 9px;

  border: 0;
  outline: 0;

  resize: none;

  background: transparent;
  color: white;
}

.composer-button {
  width: 40px;
  height: 40px;

  background: transparent;
  color: #b5bac1;

  font-size: 19px;
}

.composer-button:hover {
  color: white;
}

/* =========================================================
   RIGHT MEMBERS
========================================================= */

.member-sidebar {
  width: 220px;
  flex-shrink: 0;

  padding: 15px 10px;

  overflow-y: auto;

  background: var(--sidebar);

  border-left: 1px solid var(--border);
}

.member-title {
  margin: 8px;

  color: var(--muted);

  font-size: 11px;
  font-weight: bold;

  text-transform: uppercase;
}

/* =========================================================
   MODAL
========================================================= */

.modal {
  position: fixed;
  inset: 0;

  z-index: 500;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(0,0,0,.72);
}

.modal-box {
  width: 480px;
  max-height: 85vh;

  padding: 25px;

  overflow-y: auto;

  background: #313338;

  border-radius: 8px;

  box-shadow:
    0 25px 80px rgba(0,0,0,.55);
}

.modal-box h2 {
  margin-top: 0;
}

.modal-box label {
  display: block;

  margin: 14px 0 6px;

  color: #b5bac1;

  font-size: 11px;
  font-weight: bold;

  text-transform: uppercase;
}

.modal-input {
  width: 100%;

  padding: 11px;

  border: 0;
  border-radius: 4px;

  outline: 0;

  background: #1e1f22;
  color: white;
}

.modal-actions {
  margin-top: 20px;

  display: flex;
  justify-content: flex-end;

  gap: 8px;
}

.primary {
  padding: 10px 16px;

  border-radius: 4px;

  background: var(--accent);
  color: white;
}

.secondary {
  padding: 10px 16px;

  border-radius: 4px;

  background: #4e5058;
  color: white;
}

.danger {
  padding: 10px 16px;

  border-radius: 4px;

  background: var(--danger);
  color: white;
}

.profile-preview {
  width: 90px;
  height: 90px;

  margin: 0 auto 15px;

  overflow: hidden;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  background: var(--accent);

  font-size: 28px;
  font-weight: bold;
}

.profile-preview img {
  width: 100%;
  height: 100%;

  object-fit: cover;
}

.file-input {
  width: 100%;

  padding: 10px;

  border-radius: 5px;

  background: #1e1f22;
  color: #b5bac1;
}

/* =========================================================
   TOAST
========================================================= */

#toast {
  position: fixed;

  right: 20px;
  bottom: 20px;

  z-index: 1000;

  padding: 13px 18px;

  border-radius: 6px;

  background: #111214;
  color: white;

  box-shadow:
    0 10px 30px rgba(0,0,0,.4);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1000px) {
  .member-sidebar {
    display: none;
  }
}

@media(max-width:700px) {
  .server-bar {
    width: 62px;
  }

  .server-icon {
    width: 44px;
    height: 44px;
  }

  .channel-sidebar,
  .home-sidebar {
    width: 210px;
  }
}

</style>
</head>

<body>

<!-- ======================================================
     LOGIN
====================================================== -->

<div id="loginScreen">

  <div class="auth-box">

    <h1 id="authTitle">
      Bienvenue sur NovaChat
    </h1>

    <div
      class="auth-subtitle"
      id="authSubtitle"
    >
      Crée ton compte pour commencer.
    </div>

    <div id="registerFields">

      <label>
        Nom d'utilisateur
      </label>

      <input
        id="usernameInput"
        maxlength="24"
        placeholder="ex : Storm"
        autocomplete="username"
      >

      <label>
        Email
      </label>

      <input
        id="emailInput"
        type="email"
        placeholder="ton@email.com"
        autocomplete="email"
      >

    </div>

    <label>
      Mot de passe
    </label>

    <input
      id="passwordInput"
      type="password"
      placeholder="Mot de passe"
      autocomplete="new-password"
    >

    <button
      class="auth-button"
      id="authButton"
    >
      Créer mon compte
    </button>

    <div
      id="authError"
      class="form-error hidden"
    ></div>

    <div class="auth-switch">

      <span id="switchText">
        Tu as déjà un compte ?
      </span>

      <button id="switchAuth">
        Se connecter
      </button>

    </div>

  </div>

</div>

<!-- ======================================================
     APP
====================================================== -->

<div
  id="app"
  class="hidden"
>

  <!-- SERVER BAR -->

  <aside class="server-bar">

    <button
      class="server-icon active"
      id="homeButton"
      title="Messages privés"
    >
      N
    </button>

    <div class="server-separator"></div>

    <div id="serverList"></div>

    <button
      class="server-icon"
      id="createServerButton"
      title="Créer un serveur"
    >
      +
    </button>

    <button
      class="server-icon"
      id="joinServerButton"
      title="Rejoindre un serveur"
    >
      🔗
    </button>

  </aside>

  <!-- HOME SIDEBAR -->

  <aside
    class="home-sidebar"
    id="homeSidebar"
  >

    <div class="home-header">
      NovaChat
    </div>

    <div class="home-scroll">

      <button
        class="home-button active"
        id="friendsButton"
      >
        👥 Amis
      </button>

      <button
        class="home-button"
        id="addFriendButton"
      >
        ➕ Ajouter un ami
      </button>

      <div class="category">
        Messages privés
      </div>

      <div id="friendList"></div>

    </div>

    <div class="user-box">

      <div
        class="user-avatar"
        id="myAvatar"
      >
        ?
      </div>

      <div class="user-info">

        <div
          class="user-name"
          id="myName"
        >
          Utilisateur
        </div>

        <div class="user-status">
          ● En ligne
        </div>

      </div>

      <button
        class="user-settings-button"
        id="settingsButton"
        title="Paramètres"
      >
        ⚙
      </button>

    </div>

  </aside>

  <!-- SERVER CHANNEL SIDEBAR -->

  <aside
    class="channel-sidebar hidden"
    id="channelSidebar"
  >

    <div class="server-header">

      <div class="server-header-text">

        <div
          class="server-header-name"
          id="serverHeaderName"
        >
          Serveur
        </div>

        <div
          class="server-header-code"
          id="serverHeaderCode"
        ></div>

      </div>

      <button
        class="topbar-button"
        id="serverSettingsButton"
        title="Paramètres du serveur"
      >
        ⚙
      </button>

    </div>

    <div
      class="channel-scroll"
      id="channelList"
    ></div>

    <div class="user-box">

      <div
        class="user-avatar"
        id="serverMyAvatar"
      >
        ?
      </div>

      <div class="user-info">

        <div
          class="user-name"
          id="serverMyName"
        >
          Utilisateur
        </div>

        <div class="user-status">
          ● En ligne
        </div>

      </div>

      <button
        class="user-settings-button"
        id="serverSettingsProfile"
        title="Paramètres"
      >
        ⚙
      </button>

    </div>

  </aside>

  <!-- MAIN -->

  <main class="main">

    <header class="topbar">

      <div
        class="topbar-icon"
        id="topbarIcon"
      >
        👥
      </div>

      <div>

        <div
          class="topbar-title"
          id="chatTitle"
        >
          Amis
        </div>

        <div
          class="topbar-description"
          id="chatDescription"
        >
          Tes amis et tes conversations.
        </div>

      </div>

      <div class="topbar-spacer"></div>

      <button
        class="topbar-button hidden"
        id="callButton"
        title="Appeler"
      >
        📞
      </button>

      <button
        class="topbar-button hidden"
        id="videoButton"
        title="Appel vidéo"
      >
        📹
      </button>

    </header>

    <div
      class="messages"
      id="messages"
    >

      <div class="empty">

        <div>

          <h2>
            Bienvenue sur NovaChat 👋
          </h2>

          <p>
            Sélectionne un ami ou un serveur.
          </p>

        </div>

      </div>

    </div>

    <div
      class="composer hidden"
      id="composer"
    >

      <div class="composer-inner">

        <button
          class="composer-button"
          id="emojiButton"
          title="Emoji"
        >
          🙂
        </button>

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Envoyer un message..."
        ></textarea>

        <button
          class="composer-button"
          id="sendButton"
          title="Envoyer"
        >
          ➤
        </button>

      </div>

    </div>

  </main>

  <!-- MEMBERS -->

  <aside class="member-sidebar">

    <div class="member-title">
      Membres en ligne
    </div>

    <div id="onlineMembers"></div>

    <div class="member-title">
      Hors ligne
    </div>

    <div id="offlineMembers"></div>

  </aside>

</div>

<!-- ======================================================
     MODAL
====================================================== -->

<div
  class="modal hidden"
  id="modal"
>

  <div
    class="modal-box"
    id="modalContent"
  ></div>

</div>

<div
  id="toast"
  class="hidden"
></div>

<script>

const socket = io();

let token =
  localStorage.getItem(
    "novachat_token"
  );

let currentUser = null;
let currentFriend = null;

let currentServer = null;
let currentChannel = null;

let authMode = "register";

const $ = id =>
  document.getElementById(id);

const loginScreen =
  $("loginScreen");

const app =
  $("app");

const authTitle =
  $("authTitle");

const authSubtitle =
  $("authSubtitle");

const registerFields =
  $("registerFields");

const usernameInput =
  $("usernameInput");

const emailInput =
  $("emailInput");

const passwordInput =
  $("passwordInput");

const authButton =
  $("authButton");

const authError =
  $("authError");

const switchAuth =
  $("switchAuth");

const switchText =
  $("switchText");

const homeSidebar =
  $("homeSidebar");

const channelSidebar =
  $("channelSidebar");

const serverList =
  $("serverList");

const channelList =
  $("channelList");

const friendList =
  $("friendList");

const messages =
  $("messages");

const composer =
  $("composer");

const messageInput =
  $("messageInput");

const sendButton =

/* ========================================================
   HELPERS
======================================================== */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttribute(value) {
  return escapeHtml(value)
    .replaceAll("\n", "");
}

function initials(name) {

  return String(name || "?")
    .charAt(0)
    .toUpperCase();
}

function avatarHtml(
  user,
  className
) {

  if (user?.avatar) {

    return `
      <div class="${className}">
        <img
          src="${user.avatar}"
          alt=""
        >
      </div>
    `;

  }

  return `
    <div class="${className}">
      ${escapeHtml(
        initials(
          user?.displayName
        )
      )}
    </div>
  `;
}

function showToast(text) {

  toast.textContent =
    text;

  toast.classList.remove(
    "hidden"
  );

  clearTimeout(
    showToast.timer
  );

  showToast.timer =
    setTimeout(() => {
      toast.classList.add(
        "hidden"
      );
    }, 3000);
}

function openModal(html) {

  modalContent.innerHTML =
    html;

  modal.classList.remove(
    "hidden"
  );
}

function closeModal() {

  modal.classList.add(
    "hidden"
  );
}

modal.addEventListener(
  "click",
  event => {

    if (
      event.target === modal
    ) {
      closeModal();
    }

  }
);

async function api(
  url,
  options = {}
) {

  const headers = {
    "Content-Type":
      "application/json",
    ...(options.headers || {})
  };

  if (token) {
    headers.Authorization =
      "Bearer " + token;
  }

  const response =
    await fetch(
      url,
      {
        ...options,
        headers
      }
    );

  let data = {};

  try {
    data =
      await response.json();
  } catch {
    data = {};
  }

  if (!response.ok) {

    throw new Error(
      data.error ||
      "Une erreur est survenue."
    );
  }

  return data;
}

          );
        }

        data =
          await api(
            "/api/register",
            {
              method: "POST",
              body:
                JSON.stringify({

                  email,
                  password
                })
            }

      } else {

        data =
          await api(
            "/api/login",
            {

              body:
                JSON.stringify({

                    emailInput.value.trim(),
                  password:
                    passwordInput.value

      token =
        data.token;

      localStorage.setItem(
        "novachat_token",

      currentUser =

      enterApp();

async function openFriend(
  friend
) {

  currentFriend =
    friend;

  currentServer = null;
  currentChannel = null;

  homeSidebar.classList.remove(
    "hidden"
  );

  channelSidebar.classList.add(
    "hidden"
  );

  chatTitle.textContent =
    friend.displayName;

  chatDescription.textContent =
    friend.online
      ? "En ligne"
      : "Hors ligne";

  topbarIcon.textContent =
    "💬";

  composer.classList.remove(
    "hidden"
  );

  $("callButton")
    .classList.remove(
      "hidden"
    );

  $("videoButton")
    .classList.remove(
      "hidden"
    );

  messages.innerHTML = `
    <div class="empty">
      Chargement...
    </div>
  `;

  try {

    const data =
      await api(
        "/api/dm/" +
        encodeURIComponent(
          friend.id
        )
      );

    messages.innerHTML = "";

    if (!data.messages.length) {

      messages.innerHTML = `
        <div class="empty">
          <div>
            <h2>
              Commence la conversation
            </h2>

            <p>
              Envoie un message à
              ${escapeHtml(
                friend.displayName
              )}.
            </p>
          </div>
        </div>
      `;

      return;
    }

    for (
      const message of
      data.messages
    ) {
      renderMessage(
        message
      );
    }

    scrollMessages();

  } catch (error) {

    showToast(
      error.message
    );
  }
}

function renderMessage(
  message
) {

  let sender;

  if (
    message.senderId ===
    currentUser.id
  ) {
    sender =
      currentUser;
  } else {
    sender =
      currentFriend;
  }

  const element =
    document.createElement(
      "div"
    );

  element.className =
    "message";

  const date =
    new Date(
      message.createdAt
    );

  element.innerHTML = `
    ${avatarHtml(
      sender,
      "message-avatar"
    )}

    <div class="message-content-wrapper">

      <div class="message-header">

        <span class="message-author">
          ${escapeHtml(
            sender.displayName
          )}
        </span>

        <span class="message-time">
          ${date.toLocaleTimeString(
            [],
            {
              hour:
                "2-digit",
              minute:
                "2-digit"
            }
          )}
        </span>

      </div>

      <div class="message-text">
        ${escapeHtml(
          message.content
        )}
      </div>

    </div>
  `;

  messages.appendChild(
    element
  );
}

async function sendMessage() {

  const content =
    messageInput.value.trim();

  if (!content)
    return;

  try {

    if (
      currentFriend
    ) {

      await api(
        "/api/dm/" +
        currentFriend.id,
        {
          method: "POST",
          body:
            JSON.stringify({
              content
            })
        }
      );

    } else if (
      currentServer &&
      currentChannel &&
      currentChannel.type ===
        "text"
    ) {

      await api(
        "/api/servers/" +
        currentServer.id +
        "/messages/" +
        currentChannel.id,
        {
          method: "POST",
          body:
            JSON.stringify({
              content
            })
        }
      );
    }

    messageInput.value = "";

  } catch (error) {

    showToast(
      error.message
    );
  }
}

messageInput

async function openServer(
  serverId
) {

  try {

    const data =
      await api(
        "/api/servers/" +
        serverId
      );

    currentServer =
      data.server;

    currentFriend = null;

    homeSidebar.classList.add(
      "hidden"
    );

    channelSidebar.classList.remove(
      "hidden"
    );

    composer.classList.add(
      "hidden"
    );

    $("callButton")
      .classList.add(
        "hidden"
      );

    $("videoButton")
      .classList.add(
        "hidden"
      );

    $("serverHeaderName")
      .textContent =
      currentServer.name;

    $("serverHeaderCode")
      .textContent =
      currentServer.inviteCode
        ? "Invitation : " +
          currentServer.inviteCode
        : "";

    renderChannels();

    socket.emit(
      "server:join",
      currentServer.id
    );

    document
      .querySelectorAll(
        ".server-icon"
      )
      .forEach(
        item =>
          item.classList.remove(
            "active"
          )
      );

    const buttons =
      [
        ...document.querySelectorAll(
          "#serverList .server-icon"
        )
      ];

    const index =
      buttons.findIndex(
        button =>
          button.title ===
          currentServer.name
      );

    if (index >= 0) {

      buttons[index]
        .classList.add(
          "active"
        );
    }

    $("homeButton")
      .classList.remove(
        "active"
      );

    chatTitle.textContent =
      currentServer.name;

    chatDescription.textContent =
      "Sélectionne un salon.";

    topbarIcon.textContent =
      "◆";

    messages.innerHTML = `
      <div class="empty">
        <div>
          <h2>
            ${escapeHtml(
              currentServer.name
            )}
          </h2>

          <p>
            Choisis un salon à gauche.
          </p>
        </div>
      </div>
    `;

  } catch (error) {

    showToast(
      error.message
    );
  }
}

async function openTextChannel(
  channel,
  button
) {

  currentChannel =
    channel;

  document
    .querySelectorAll(
      ".channel"
    )
    .forEach(
      item =>
        item.classList.remove(
          "active"
        )
    );

  button.classList.add(
    "active"
  );

  composer.classList.remove(
    "hidden"
  );

  chatTitle.textContent =
    channel.name;

  chatDescription.textContent =
    "Salon textuel";

  topbarIcon.textContent =
    "#";

  try {

    const data =
      await api(
        "/api/servers/" +
        currentServer.id +
        "/messages/" +
        channel.id
      );

    messages.innerHTML = "";

    if (
      !data.messages.length
    ) {

      messages.innerHTML = `
        <div class="empty">
          <div>
            <h2>
              # ${escapeHtml(
                channel.name
              )}
            </h2>

            <p>
              Aucun message pour le moment.
            </p>
          </div>
        </div>
      `;

      return;
    }

    for (
      const message of
      data.messages
    ) {

      renderServerMessage(
        message
      );
    }

    scrollMessages();

  } catch (error) {

    showToast(
      error.message
    );
  }
}

function renderServerMessage(
  message
) {

  const user =
    currentServer.members.find(
      member =>
        member.id ===
        message.senderId
    );

  if (!user)
    return;

  const element =
    document.createElement(
      "div"
    );

  element.className =
    "message";

  const date =
    new Date(
      message.createdAt
    );

  element.innerHTML = `
    ${avatarHtml(
      user,
      "message-avatar"
    )}

    <div class="message-content-wrapper">

      <div class="message-header">

        <span class="message-author">
          ${escapeHtml(
            user.displayName
          )}
        </span>

        <span class="message-time">
          ${date.toLocaleTimeString(
            [],
            {
              hour:
                "2-digit",
              minute:
                "2-digit"
            }
          )}
        </span>

      </div>

      <div class="message-text">
        ${escapeHtml(
          message.content
        )}
      </div>

    </div>
  `;

  messages.appendChild(
    element
  );
}

/* ========================================================
   VOICE
======================================================== */

let localStream = null;
let voicePeers = new Map();

async function joinVoice(
  channel
) {

  if (
    !currentServer
  )
    return;

  try {

    if (
      currentChannel?.type ===
      "voice"
    ) {
      socket.emit(
        "voice:leave"
      );
    }

    currentChannel =
      channel;

    localStream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio: true,
          video: false
        });

    socket.emit(
      "voice:join",
      {
        serverId:
          currentServer.id,
        channelId:
          channel.id
      }
    );

    chatTitle.textContent =
      channel.name;

    chatDescription.textContent =
      "Salon vocal";

    topbarIcon.textContent =
      "🔊";

    composer.classList.add(
      "hidden"
    );

    messages.innerHTML = `
      <div class="empty">
        <div>
          <h2>
            🔊 ${escapeHtml(
              channel.name
            )}
          </h2>

          <p>
            Tu es connecté au salon vocal.
          </p>

          <button
            class="danger"
            id="leaveVoiceButton"
            style="margin-top:15px"
          >
            ☎ Quitter le vocal
          </button>
        </div>
      </div>
    `;

    $("leaveVoiceButton")
      .addEventListener(
        "click",
        leaveVoice
      );

    showToast(
      "Connecté au vocal."
    );

  } catch (error) {

    console.error(error);

    showToast(
      "Impossible d'accéder au microphone. Vérifie les permissions du navigateur."
    );
  }
}

function leaveVoice() {

  socket.emit(
    "voice:leave"
  );

  if (localStream) {

    localStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    localStream = null;
  }

  for (
    const peer of
    voicePeers.values()
  ) {

    peer.close();
  }

  voicePeers.clear();

  if (
    currentServer
  ) {

    const textChannel =
      currentServer.channels.find(
        channel =>
          channel.type ===
          "text"
      );

    if (textChannel) {

      openTextChannel(
        textChannel,
        document.querySelector(
          `.channel`
        )
      );
    }
  }

  showToast(
    "Tu as quitté le vocal."
  );
}

        currentServer.id

        currentServer.channels.find(

);

function updateVoiceUsersForChannel(

  users
) {

  const container =

      channelId

  if (!container)

  if (!users) {

    container.innerHTML =
      "";

    return;
  }

  container.innerHTML =
    users.map(
      user => `
        <div class="voice-user">

          ${avatarHtml(
            user,
            "voice-user-avatar"
          )}

          <div class="voice-user-name">
            ${escapeHtml(

        </div>
      `
    ).join("");
}

/* ========================================================

======================================================== */

function renderMembers(
  friends
) {

  const online =
    friends.filter(
      friend =>
        friend.online
    );

  const offline =
    friends.filter(
      friend =>
        !friend.online
    );

  $("onlineMembers")
    .innerHTML =
    online
      .map(memberHtml)
      .join("");

  $("offlineMembers")
    .innerHTML =
    offline
      .map(memberHtml)
      .join("");
}

function memberHtml(
  user
) {

  return `
    <div class="friend-item">

      ${avatarHtml(
        user,
        "friend-avatar"
      )}

      <div class="friend-info">

        <div class="friend-name">
          ${escapeHtml(
            user.displayName
          )}
        </div>

        <div class="friend-status">
          ${
            user.online
              ? "En ligne"
              : "Hors ligne"
          }
        </div>

      </div>

    </div>
  `;
}

  "auth:error",
  () => {

    localStorage.removeItem(
      "novachat_token"
    );

    token = null;

    location.reload();
  }
);

socket.on(
  "users:update",
  async () => {

    if (!token)
      return;

    await loadFriends();
    await loadServers();

    if (
      currentServer
    ) {

      try {

        const data =
          await api(
            "/api/servers/" +
            currentServer.id
          );

        currentServer =
          data.server;

        renderChannels();

      } catch {}
    }
  }
);

socket.on(
  "dm:new",
  data => {

    if (!currentFriend)
      return;

    const message =
      data.message;

    const belongs =
      (
        message.senderId ===
          currentFriend.id &&
        message.receiverId ===
          currentUser.id
      ) ||
      (
        message.senderId ===
          currentUser.id &&
        message.receiverId ===
          currentFriend.id
      );

    if (!belongs)
      return;

    if (
      !messages.querySelector(
        ".message"
      )
    ) {
      messages.innerHTML =
        "";
    }

    renderMessage(
      message
    );

    scrollMessages();
  }
);

socket.on(
  "server:message",
  data => {

    if (
      !currentServer ||
      !currentChannel
    )
      return;

    const message =
      data.message;

    if (
      message.serverId !==
      currentServer.id
    )
      return;

    if (
      message.channelId !==
      currentChannel.id
    )
      return;

    if (
      messages.querySelector(
        ".empty"
      )
    ) {
      messages.innerHTML =
        "";
    }

    renderServerMessage(
      message
    );

    scrollMessages();
  }
);
