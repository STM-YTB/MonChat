<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaChat</title>

<style>
:root {
    --bg: #0c0f16;
    --panel: #111620;
    --panel2: #171d29;
    --panel3: #1d2533;
    --border: rgba(255,255,255,.07);
    --text: #edf2ff;
    --muted: #8993a7;
    --accent: #7c6cff;
    --accent2: #9a8fff;
    --green: #38d996;
    --red: #ff5d73;
    --yellow: #f7c95c;
    --shadow: 0 18px 60px rgba(0,0,0,.35);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
}

button,
input,
textarea {
    font: inherit;
}

button {
    border: 0;
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* LOGIN */

.login {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    background:
        radial-gradient(circle at 20% 20%, rgba(124,108,255,.20), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(56,217,150,.10), transparent 30%),
        var(--bg);
}

.login-card {
    width: min(440px, 100%);
    padding: 42px;
    border: 1px solid var(--border);
    border-radius: 28px;
    background: rgba(17,22,32,.86);
    backdrop-filter: blur(24px);
    box-shadow: var(--shadow);
}

.logo {
    width: 68px;
    height: 68px;
    border-radius: 20px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, var(--accent), #4d9dff);
    font-size: 30px;
    font-weight: 900;
    margin-bottom: 24px;
}

.login h1 {
    margin: 0 0 10px;
    font-size: 34px;
}

.login p {
    color: var(--muted);
    line-height: 1.6;
}

.field {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    outline: none;
    background: var(--panel2);
    color: var(--text);
    margin-top: 16px;
}

.primary {
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    border-radius: 12px;
    color: white;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), #5e9cff);
    transition: .2s;
}

.primary:hover {
    transform: translateY(-2px);
    filter: brightness(1.08);
}

/* APP */

.app {
    height: 100vh;
    display: grid;
    grid-template-columns: 76px 245px minmax(0,1fr) 260px;
}

/* SERVERS */

.servers {
    background: #090c12;
    border-right: 1px solid var(--border);
    padding: 12px 9px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
}

.server-button {
    position: relative;
    width: 52px;
    height: 52px;
    border-radius: 17px;
    background: var(--panel2);
    color: var(--text);
    font-weight: 900;
    font-size: 18px;
    transition: .2s;
}

.server-button:hover,
.server-button.active {
    border-radius: 14px;
    background: var(--accent);
    transform: translateY(-2px);
}

.server-button.notification::after {
    content: "";
    position: absolute;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--red);
    right: 1px;
    top: 1px;
}

.server-add {
    color: var(--green);
    font-size: 25px;
}

.server-spacer {
    flex: 1;
}

/* CHANNELS */

.channels {
    background: var(--panel);
    border-right: 1px solid var(--border);
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.server-header {
    height: 66px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    font-weight: 900;
}

.channel-list {
    padding: 14px 10px;
    overflow-y: auto;
}

.category {
    margin: 15px 8px 7px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: .12em;
}

.channel {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px 11px;
    border-radius: 9px;
    color: var(--muted);
    background: transparent;
    text-align: left;
    margin-bottom: 3px;
}

.channel:hover {
    color: var(--text);
    background: var(--panel2);
}

.channel.active {
    color: white;
    background: var(--panel3);
}

.channel-icon {
    width: 20px;
    text-align: center;
    font-size: 17px;
}

.channel-add {
    margin-left: auto;
    opacity: .6;
}

/* CHAT */

.chat {
    min-width: 0;
    display: flex;
    flex-direction: column;
    background:
        radial-gradient(circle at 90% 10%, rgba(124,108,255,.05), transparent 30%),
        var(--bg);
}

.chat-header {
    height: 66px;
    padding: 0 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
}

.chat-title {
    font-weight: 900;
}

.chat-description {
    color: var(--muted);
    font-size: 12px;
}

.header-spacer {
    flex: 1;
}

.icon-button {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
}

.icon-button:hover {
    background: var(--panel2);
    color: white;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 22px 24px;
}

.message {
    position: relative;
    display: flex;
    gap: 12px;
    padding: 9px 12px;
    margin: 1px 0;
    border-radius: 10px;
    animation: messageIn .18s ease-out;
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message:hover {
    background: rgba(255,255,255,.025);
}

.avatar {
    width: 42px;
    height: 42px;
    flex: 0 0 42px;
    display: grid;
    place-items: center;
    border-radius: 13px;
    background: linear-gradient(135deg, #5e9cff, #806bff);
    color: white;
    font-weight: 900;
}

.message-body {
    min-width: 0;
    flex: 1;
}

.message-meta {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 4px;
}

.username {
    font-weight: 850;
}

.time {
    color: var(--muted);
    font-size: 11px;
}

.message-text {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    color: #dbe2f2;
    line-height: 1.55;
}

.reactions {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 8px;
}

.reaction {
    padding: 5px 8px;
    border-radius: 8px;
    background: var(--panel2);
    color: #dbe2f2;
}

.reaction:hover {
    background: var(--panel3);
}

.composer {
    padding: 12px 18px 18px;
}

.composer-box {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 9px;
    border: 1px solid var(--border);
    border-radius: 15px;
    background: var(--panel);
}

.composer textarea {
    flex: 1;
    min-height: 42px;
    max-height: 150px;
    resize: none;
    outline: none;
    border: 0;
    background: transparent;
    color: white;
    padding: 10px;
}

.send {
    width: 42px;
    height: 42px;
    border-radius: 11px;
    background: var(--accent);
    color: white;
}

/* MEMBERS */

.members {
    background: var(--panel);
    border-left: 1px solid var(--border);
    padding: 18px 13px;
    overflow-y: auto;
}

.members h3 {
    margin: 6px 8px 12px;
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
}

.member {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: 10px;
    background: transparent;
    color: white;
    text-align: left;
}

.member:hover {
    background: var(--panel2);
}

.member .avatar {
    width: 36px;
    height: 36px;
    flex-basis: 36px;
    border-radius: 11px;
}

.member-info {
    min-width: 0;
}

.member-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.status {
    color: var(--muted);
    font-size: 11px;
}

.presence {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--green);
    margin-left: auto;
}

.presence.offline {
    background: #525a68;
}

/* MODALS */

.overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 20px;
    background: rgba(0,0,0,.65);
    backdrop-filter: blur(8px);
}

.modal {
    width: min(520px, 100%);
    max-height: 90vh;
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 22px;
    background: var(--panel);
    box-shadow: var(--shadow);
    padding: 22px;
    animation: modalIn .18s ease-out;
}

@keyframes modalIn {
    from {
        opacity: 0;
        transform: scale(.96);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
}

.modal h2 {
    margin: 0;
}

.close {
    width: 35px;
    height: 35px;
    border-radius: 10px;
    background: var(--panel2);
    color: var(--muted);
}

.modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
}

.secondary {
    padding: 11px 15px;
    border-radius: 10px;
    background: var(--panel2);
    color: white;
}

.danger {
    background: rgba(255,93,115,.13);
    color: #ff8294;
}

/* PROFILE */

.profile-card {
    text-align: center;
}

.profile-card .big-avatar {
    width: 92px;
    height: 92px;
    margin: 0 auto 15px;
    display: grid;
    place-items: center;
    border-radius: 27px;
    background: linear-gradient(135deg, var(--accent), #4d9dff);
    font-size: 35px;
    font-weight: 900;
}

.profile-card h2 {
    margin: 0;
}

.profile-bio {
    color: var(--muted);
    margin: 10px 0 20px;
    line-height: 1.6;
}

/* CALL */

.call-window {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 90;
    width: min(700px, calc(100vw - 48px));
    border: 1px solid var(--border);
    border-radius: 22px;
    background: rgba(17,22,32,.95);
    backdrop-filter: blur(20px);
    box-shadow: var(--shadow);
    overflow: hidden;
}

.call-header {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
}

.call-title {
    font-weight: 900;
}

.call-videos {
    min-height: 280px;
    padding: 12px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
}

.video-tile {
    position: relative;
    min-height: 190px;
    border-radius: 16px;
    overflow: hidden;
    background: #06080c;
}

.video-tile video {
    width: 100%;
    height: 100%;
    min-height: 190px;
    object-fit: cover;
}

.video-name {
    position: absolute;
    left: 10px;
    bottom: 10px;
    padding: 6px 9px;
    border-radius: 8px;
    background: rgba(0,0,0,.55);
    font-size: 12px;
}

.call-controls {
    display: flex;
    justify-content: center;
    gap: 9px;
    padding: 13px;
    border-top: 1px solid var(--border);
}

.call-control {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--panel3);
    color: white;
}

.call-control.active {
    background: var(--accent);
}

.call-control.hangup {
    background: var(--red);
}

/* TOAST */

.toast-container {
    position: fixed;
    right: 20px;
    top: 20px;
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.toast {
    max-width: 330px;
    padding: 13px 16px;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: var(--panel);
    box-shadow: var(--shadow);
    animation: toastIn .2s ease;
}

@keyframes toastIn {
    from {
        opacity: 0;
        transform: translateX(15px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

/* CONTEXT */

.context {
    position: fixed;
    z-index: 300;
    width: 190px;
    padding: 6px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
    box-shadow: var(--shadow);
}

.context button {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    text-align: left;
}

.context button:hover {
    background: var(--panel2);
}

@media(max-width: 1050px) {
    .app {
        grid-template-columns: 68px 220px minmax(0,1fr);
    }

    .members {
        display: none;
    }
}

@media(max-width: 700px) {
    .app {
        grid-template-columns: 60px minmax(0,1fr);
    }

    .channels {
        display: none;
    }

    .messages {
        padding: 14px 10px;
    }

    .login-card {
        padding: 28px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="loginScreen" class="login">
    <div class="login-card">
        <div class="logo">N</div>

        <h1>Bienvenue sur Nova</h1>

        <p>
            Ton espace de discussion pour discuter, jouer,
            partager et retrouver tes amis.
        </p>

        <input
            id="usernameInput"
            class="field"
            maxlength="24"
            placeholder="Ton nom d'utilisateur"
        >

        <button id="loginButton" class="primary">
            Entrer dans Nova
        </button>
    </div>
</section>

<!-- APPLICATION -->

<div id="app" class="app hidden">

    <!-- SERVERS -->

    <aside class="servers" id="serverBar"></aside>

    <!-- CHANNELS -->

    <aside class="channels">

        <div class="server-header">
            <span id="serverName">Nova</span>

            <button
                class="icon-button"
                id="serverMenuButton"
                title="Options du serveur"
            >⋮</button>
        </div>

        <div class="channel-list" id="channelList"></div>

        <button
            id="friendsButton"
            class="channel"
            style="margin:10px;width:calc(100% - 20px)"
        >
            <span>👥</span>
            <span>Amis</span>
        </button>

    </aside>

    <!-- CHAT -->

    <main class="chat">

        <header class="chat-header">

            <div>
                <div id="channelTitle" class="chat-title">
                    # général
                </div>

                <div id="channelDescription" class="chat-description">
                    Discutez avec votre communauté
                </div>
            </div>

            <div class="header-spacer"></div>

            <button
                class="icon-button"
                id="searchButton"
                title="Rechercher"
            >⌕</button>

            <button
                class="icon-button"
                id="membersButton"
                title="Membres"
            >♟</button>

            <button
                class="icon-button"
                id="profileButton"
                title="Mon profil"
            >●</button>

        </header>

        <section id="messages" class="messages"></section>

        <div class="composer">

            <div class="composer-box">

                <button
                    id="emojiButton"
                    class="icon-button"
                    title="Emoji"
                >☺</button>

                <textarea
                    id="messageInput"
                    placeholder="Écrire un message..."
                    rows="1"
                ></textarea>

                <button
                    id="sendButton"
                    class="send"
                    title="Envoyer"
                >➤</button>

            </div>

        </div>

    </main>

    <!-- MEMBERS -->

    <aside class="members">

        <h3>En ligne</h3>

        <div id="onlineMembers"></div>

        <h3 style="margin-top:25px">Hors ligne</h3>

        <div id="offlineMembers"></div>

    </aside>

</div>

<!-- TOAST -->

<div id="toastContainer" class="toast-container"></div>

<!-- MODAL -->

<div id="modalOverlay" class="overlay hidden">
    <div id="modal" class="modal"></div>
</div>

<!-- CONTEXT MENU -->

<div id="contextMenu" class="context hidden"></div>

<!-- CALL -->

<div id="callWindow" class="call-window hidden">

    <div class="call-header">

        <span>🔊</span>

        <span id="callTitle" class="call-title">
            Appel
        </span>

        <div class="header-spacer"></div>

        <button
            class="icon-button"
            onclick="closeCall()"
        >×</button>

    </div>

    <div id="callVideos" class="call-videos"></div>

    <div class="call-controls">

        <button
            id="muteButton"
            class="call-control"
            title="Micro"
        >🎙️</button>

        <button
            id="cameraButton"
            class="call-control"
            title="Caméra"
        >📷</button>

        <button
            id="screenButton"
            class="call-control"
            title="Partager l'écran"
        >🖥️</button>

        <button
            class="call-control hangup"
            onclick="closeCall()"
            title="Raccrocher"
        >☎</button>

    </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
/*
|--------------------------------------------------------------------------
| NOVACHAT CLIENT
|--------------------------------------------------------------------------
*/

const socket = io();

let me = null;
let servers = [];
let currentServer = null;
let currentChannel = null;
let currentMessages = [];

let onlineUsers = [];

let selectedMessage = null;

let callRoom = null;
let localStream = null;
let screenStream = null;

const peers = new Map();

const rtcConfig = {
    iceServers: [
        {
            urls: "stun:stun.l.google.com:19302"
        },
        {
            urls: "stun:stun1.l.google.com:19302"
        }
    ]
};

/* -----------------------------------------------------------------------
   DOM
------------------------------------------------------------------------ */

const loginScreen = document.getElementById("loginScreen");
const app = document.getElementById("app");

const usernameInput = document.getElementById("usernameInput");
const loginButton = document.getElementById("loginButton");

const serverBar = document.getElementById("serverBar");
const channelList = document.getElementById("channelList");

const serverName = document.getElementById("serverName");
const channelTitle = document.getElementById("channelTitle");
const channelDescription = document.getElementById("channelDescription");

const messagesEl = document.getElementById("messages");
const messageInput = document.getElementById("messageInput");

const onlineMembers = document.getElementById("onlineMembers");
const offlineMembers = document.getElementById("offlineMembers");

const modalOverlay = document.getElementById("modalOverlay");
const modal = document.getElementById("modal");

const toastContainer = document.getElementById("toastContainer");

const contextMenu = document.getElementById("contextMenu");

const callWindow = document.getElementById("callWindow");
const callVideos = document.getElementById("callVideos");

/* -----------------------------------------------------------------------
   UTILITAIRES
------------------------------------------------------------------------ */

function escapeHTML(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function toast(message) {
    const el = document.createElement("div");

    el.className = "toast";
    el.textContent = message;

    toastContainer.appendChild(el);

    setTimeout(() => {
        el.remove();
    }, 3500);
}

function closeModal() {
    modalOverlay.classList.add("hidden");
}

function openModal(html) {
    modal.innerHTML = html;
    modalOverlay.classList.remove("hidden");
}

modalOverlay.addEventListener("click", e => {
    if (e.target === modalOverlay) {
        closeModal();
    }
});

function formatTime(timestamp) {
    return new Date(timestamp).toLocaleTimeString("fr-FR", {
        hour: "2-digit",
        minute: "2-digit"
    });
}

function getInitial(name) {
    return String(name || "?").charAt(0).toUpperCase();
}

/* -----------------------------------------------------------------------
   LOGIN
------------------------------------------------------------------------ */

const savedUsername = localStorage.getItem("nova_username");

if (savedUsername) {
    usernameInput.value = savedUsername;
}

loginButton.addEventListener("click", login);

usernameInput.addEventListener("keydown", e => {
    if (e.key === "Enter") {
        login();
    }
});

function login() {

    const username = usernameInput.value.trim();

    if (!username) {
        toast("Choisis un pseudo.");
        return;
    }

    localStorage.setItem("nova_username", username);

    socket.emit("user:login", {
        username
    });
}

/* -----------------------------------------------------------------------
   USER READY
------------------------------------------------------------------------ */

socket.on("user:ready", user => {

    me = user;

    loginScreen.classList.add("hidden");
    app.classList.remove("hidden");

    toast(`Bienvenue ${user.username} !`);

    renderProfileButton();
});

socket.on("user:error", message => {
    toast(message);
});

/* -----------------------------------------------------------------------
   SERVERS
------------------------------------------------------------------------ */

socket.on("servers:list", list => {

    servers = list;

    renderServers();

    if (!currentServer && servers.length) {
        selectServer(servers[0].id);
    }
});

socket.on("server:created", data => {

    toast(`Serveur "${data.name}" créé.`);

    socket.emit("server:join", {
        serverId: data.id
    });
});

socket.on("server:joined", data => {

    const s = servers.find(x => x.id === data.serverId);

    if (s) {
        selectServer(s.id);
    }
});

socket.on("server:members", data => {

    if (!currentServer) return;

    if (data.serverId !== currentServer.id) return;

    renderMembers(data.members);
});

function renderServers() {

    serverBar.innerHTML = "";

    servers.forEach(s => {

        const button = document.createElement("button");

        button.className =
            "server-button " +
            (currentServer?.id === s.id ? "active" : "");

        button.textContent = s.icon;

        button.title = s.name;

        button.addEventListener("click", () => {
            selectServer(s.id);
        });

        serverBar.appendChild(button);
    });

    const add = document.createElement("button");

    add.className = "server-button server-add";
    add.textContent = "+";
    add.title = "Créer un serveur";

    add.addEventListener("click", createServer);

    serverBar.appendChild(add);

    const spacer = document.createElement("div");
    spacer.className = "server-spacer";

    serverBar.appendChild(spacer);

    const settings = document.createElement("button");

    settings.className = "server-button";
    settings.textContent = "⚙";
    settings.title = "Paramètres";

    settings.onclick = openSettings;

    serverBar.appendChild(settings);
}

function selectServer(serverId) {

    currentServer = servers.find(s => s.id === serverId);

    if (!currentServer) return;

    serverName.textContent = currentServer.name;

    renderServers();
    renderChannels();

    const firstText =
        currentServer.channels.find(c => c.type === "text");

    if (firstText) {
        selectChannel(firstText.id);
    }
}

function renderChannels() {

    channelList.innerHTML = "";

    const textChannels =
        currentServer.channels.filter(c => c.type === "text");

    const voiceChannels =
        currentServer.channels.filter(c => c.type === "voice");

    if (textChannels.length) {

        const category = document.createElement("div");

        category.className = "category";
        category.textContent = "Discussion";

        channelList.appendChild(category);

        textChannels.forEach(channel => {
            channelList.appendChild(
                createChannelButton(channel)
            );
        });
    }

    if (voiceChannels.length) {

        const category = document.createElement("div");

        category.className = "category";
        category.textContent = "Vocal";

        channelList.appendChild(category);

        voiceChannels.forEach(channel => {
            channelList.appendChild(
                createChannelButton(channel)
            );
        });
    }

    const addButton = document.createElement("button");

    addButton.className = "channel";

    addButton.innerHTML = `
        <span>＋</span>
        <span>Ajouter un salon</span>
    `;

    addButton.onclick = createChannel;

    channelList.appendChild(addButton);
}

function createChannelButton(channel) {

    const button = document.createElement("button");

    button.className =
        "channel " +
        (currentChannel?.id === channel.id ? "active" : "");

    button.innerHTML = `
        <span class="channel-icon">
            ${channel.type === "voice" ? "🔊" : "#"}
        </span>
        <span>${escapeHTML(channel.name)}</span>
    `;

    button.onclick = () => {

        if (channel.type === "voice") {
            startCall(channel);
        } else {
            selectChannel(channel.id);
        }
    };

    return button;
}

function selectChannel(channelId) {

    currentChannel =
        currentServer.channels.find(c => c.id === channelId);

    if (!currentChannel) return;

    renderChannels();

    channelTitle.textContent =
        "# " + currentChannel.name;

    channelDescription.textContent =
        "Discutez avec les membres de ce salon.";

    socket.emit("channel:join", {
        serverId: currentServer.id,
        channelId: currentChannel.id
    });
}

socket.on("messages:list", data => {

    if (
        !currentServer ||
        data.serverId !== currentServer.id ||
        !currentChannel ||
        data.channelId !== currentChannel.id
    ) return;

    currentMessages = data.messages || [];

    renderMessages();
});

socket.on("message:new", data => {

    if (
        currentServer &&
        data.serverId === currentServer.id &&
        currentChannel &&
        data.channelId === currentChannel.id
    ) {
        currentMessages.push(data.message);

        renderMessages();

        messagesEl.scrollTop = messagesEl.scrollHeight;
    }
});

socket.on("message:updated", data => {

    const index =
        currentMessages.findIndex(m => m.id === data.message.id);

    if (index !== -1) {
        currentMessages[index] = data.message;
        renderMessages();
    }
});

socket.on("message:deleted", data => {

    currentMessages =
        currentMessages.filter(
            m => m.id !== data.messageId
        );

    renderMessages();
});

socket.on("message:reactionUpdated", data => {

    const message =
        currentMessages.find(m => m.id === data.messageId);

    if (!message) return;

    message.reactions = data.reactions;

    renderMessages();
});

/* -----------------------------------------------------------------------
   MESSAGES
------------------------------------------------------------------------ */

function renderMessages() {

    messagesEl.innerHTML = "";

    let lastUser = null;

    currentMessages.forEach(message => {

        const article = document.createElement("article");

        article.className = "message";

        article.dataset.id = message.id;

        article.innerHTML = `
            <div class="avatar">
                ${escapeHTML(message.avatar || getInitial(message.username))}
            </div>

            <div class="message-body">

                <div class="message-meta">
                    <span class="username">
                        ${escapeHTML(message.username)}
                    </span>

                    <span class="time">
                        ${formatTime(message.timestamp)}
                        ${message.edited ? " • modifié" : ""}
                    </span>
                </div>

                <div class="message-text">
                    ${escapeHTML(message.content)}
                </div>

                <div class="reactions">
                    ${renderReactions(message)}
                </div>

            </div>
        `;

        article.addEventListener("contextmenu", e => {

            e.preventDefault();

            openMessageContextMenu(
                e.clientX,
                e.clientY,
                message
            );
        });

        article.addEventListener("dblclick", () => {

            socket.emit("message:reaction", {
                serverId: currentServer.id,
                channelId: currentChannel.id,
                messageId: message.id,
                emoji: "❤️"
            });
        });

        messagesEl.appendChild(article);

        lastUser = message.userId;
    });

    if (currentMessages.length) {
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }
}

function renderReactions(message) {

    if (!message.reactions) return "";

    return Object.entries(message.reactions)
        .map(([emoji, ids]) => {

            return `
                <button
                    class="reaction"
                    onclick="reactToMessage('${message.id}', '${emoji}')"
                >
                    ${emoji} ${ids.length}
                </button>
            `;
        })
        .join("");
}

function reactToMessage(messageId, emoji) {

    socket.emit("message:reaction", {
        serverId: currentServer.id,
        channelId: currentChannel.id,
        messageId,
        emoji
    });
}

function sendMessage() {

    const content = messageInput.value;

    if (!content.trim()) return;

    socket.emit("message:send", {
        serverId: currentServer.id,
        channelId: currentChannel.id,
        content
    });

    messageInput.value = "";

    messageInput.style.height = "42px";
}

document.getElementById("sendButton")
    .addEventListener("click", sendMessage);

messageInput.addEventListener("keydown", e => {

    if (e.key === "Enter" && !e.shiftKey) {

        e.preventDefault();

        sendMessage();
    }
});

messageInput.addEventListener("input", () => {

    messageInput.style.height = "auto";

    messageInput.style.height =
        Math.min(messageInput.scrollHeight, 150) + "px";
});

/* -----------------------------------------------------------------------
   MENU MESSAGE
------------------------------------------------------------------------ */

function openMessageContextMenu(x, y, message) {

    selectedMessage = message;

    contextMenu.innerHTML = `
        <button onclick="reactToMessage('${message.id}','👍')">
            👍 Réagir
        </button>

        <button onclick="copyMessage()">
            📋 Copier
        </button>

        ${
            message.userId === me.id
            ? `
                <button onclick="editMessage()">
                    ✏️ Modifier
                </button>

                <button onclick="deleteMessage()">
                    🗑️ Supprimer
                </button>
            `
            : ""
        }
    `;

    contextMenu.style.left = x + "px";
    contextMenu.style.top = y + "px";

    contextMenu.classList.remove("hidden");
}

document.addEventListener("click", e => {

    if (!contextMenu.contains(e.target)) {
        contextMenu.classList.add("hidden");
    }
});

function copyMessage() {

    if (!selectedMessage) return;

    navigator.clipboard.writeText(
        selectedMessage.content
    );

    toast("Message copié.");
    contextMenu.classList.add("hidden");
}

function editMessage() {

    if (!selectedMessage) return;

    const value =
        prompt("Modifier le message :", selectedMessage.content);

    if (!value?.trim()) return;

    socket.emit("message:edit", {
        serverId: currentServer.id,
        channelId: currentChannel.id,
        messageId: selectedMessage.id,
        content: value
    });

    contextMenu.classList.add("hidden");
}

function deleteMessage() {

    if (!selectedMessage) return;

    if (!confirm("Supprimer ce message ?")) return;

    socket.emit("message:delete", {
        serverId: currentServer.id,
        channelId: currentChannel.id,
        messageId: selectedMessage.id
    });

    contextMenu.classList.add("hidden");
}

            container.appendChild(createMember(user));
        });
    });

/* -----------------------------------------------------------------------
   PROFIL PERSONNEL
------------------------------------------------------------------------ */

document.getElementById("profileButton")
    .addEventListener("click", () => {
        openProfile(me);
    });

/* -----------------------------------------------------------------------
   APPELS WEBRTC
------------------------------------------------------------------------ */

async function startCall(channel) {

    if (channel.type !== "voice") return;

    callRoom =
        currentServer.id + ":" + channel.id;

    callWindow.classList.remove("hidden");

    document.getElementById("callTitle").textContent =
        "🔊 " + channel.name;

    try {

        localStream =
            await navigator.mediaDevices.getUserMedia({
                audio: true,
                video: true
            });

    } catch (error) {

        try {

            localStream =
                await navigator.mediaDevices.getUserMedia({
                    audio: true,
                    video: false
                });

        } catch (e) {

            toast(
                "Impossible d'accéder au microphone."
            );

            return;
        }
    }

    addVideo(
        "local",
        localStream,
        me.username
    );

    socket.emit("call:join", {
        room: callRoom
    });
}

socket.on("call:existingUsers", async users => {

    for (const remote of users) {

        await createPeerConnection(
            remote.socketId,
            true
        );
    }
});

socket.on("call:userJoined", async data => {

    await createPeerConnection(
        data.socketId,
        true
    );
});

async function createPeerConnection(
    remoteSocketId,
    initiator
) {

    if (peers.has(remoteSocketId)) {
        return peers.get(remoteSocketId);
    }

    const pc =
        new RTCPeerConnection(rtcConfig);

    peers.set(remoteSocketId, pc);

    if (localStream) {

        localStream
            .getTracks()
            .forEach(track => {

                pc.addTrack(
                    track,
                    localStream
                );
            });
    }

    pc.onicecandidate = event => {

        if (!event.candidate) return;

        socket.emit("call:ice", {
            target: remoteSocketId,
            candidate: event.candidate
        });
    };

    pc.ontrack = event => {

        const stream =
            event.streams[0];

        addVideo(
            remoteSocketId,
            stream,
            "Membre"
        );
    };

    pc.onconnectionstatechange = () => {

        if (
            pc.connectionState === "failed" ||
            pc.connectionState === "disconnected" ||
            pc.connectionState === "closed"
        ) {

            removeVideo(remoteSocketId);

            pc.close();

            peers.delete(remoteSocketId);
        }
    };

    if (initiator) {

        const offer =
            await pc.createOffer();

        await pc.setLocalDescription(offer);

        socket.emit("call:offer", {
            target: remoteSocketId,
            offer
        });
    }

    return pc;
}

socket.on("call:offer", async data => {

    const pc =
        await createPeerConnection(
            data.from,
            false
        );

    await pc.setRemoteDescription(
        new RTCSessionDescription(data.offer)
    );

    const answer =
        await pc.createAnswer();

    await pc.setLocalDescription(answer);

    socket.emit("call:answer", {
        target: data.from,
        answer
    });
});

socket.on("call:answer", async data => {

    const pc = peers.get(data.from);

    if (!pc) return;

    await pc.setRemoteDescription(
        new RTCSessionDescription(data.answer)
    );
});

socket.on("call:ice", async data => {

    const pc = peers.get(data.from);

    if (!pc) return;

    try {
        await pc.addIceCandidate(
            new RTCIceCandidate(data.candidate)
        );
    } catch (error) {
        console.warn(error);
    }
});

socket.on("call:userLeft", data => {

    const pc = peers.get(data.socketId);

    if (pc) {
        pc.close();
        peers.delete(data.socketId);
    }

    removeVideo(data.socketId);
});

function addVideo(id, stream, name) {

    if (document.getElementById("video-" + id)) {
        return;
    }

    const tile =
        document.createElement("div");

    tile.className = "video-tile";
    tile.id = "video-" + id;

    const video =
        document.createElement("video");

    video.autoplay = true;
    video.playsInline = true;
    video.muted = id === "local";
    video.srcObject = stream;

    const label =
        document.createElement("div");

    label.className = "video-name";
    label.textContent = name;

    tile.appendChild(video);
    tile.appendChild(label);

    callVideos.appendChild(tile);
}

function removeVideo(id) {

    const el =
        document.getElementById("video-" + id);

    if (el) {
        el.remove();
    }
}

async function toggleScreenShare() {

    if (!localStream) return;

    if (!screenStream) {

        try {

            screenStream =
                await navigator.mediaDevices.getDisplayMedia({
                    video: true,
                    audio: true
                });

            const screenTrack =
                screenStream.getVideoTracks()[0];

            peers.forEach(pc => {

                const sender =
                    pc.getSenders().find(
                        s => s.track?.kind === "video"
                    );

                if (sender) {
                    sender.replaceTrack(screenTrack);
                }
            });

            const localVideo =
                document.querySelector("#video-local video");

            if (localVideo) {
                localVideo.srcObject =
                    screenStream;
            }

            screenTrack.onended =
                stopScreenShare;

            toast("Partage d'écran activé.");

        } catch {
            toast("Partage d'écran annulé.");
        }

    } else {

        stopScreenShare();
    }
}

function stopScreenShare() {

    if (!screenStream) return;

    screenStream
        .getTracks()
        .forEach(track => track.stop());

    screenStream = null;

    const cameraTrack =
        localStream?.getVideoTracks()[0];

    if (cameraTrack) {

        peers.forEach(pc => {

            const sender =
                pc.getSenders().find(
                    s => s.track?.kind === "video"
                );

            if (sender) {
                sender.replaceTrack(cameraTrack);
            }
        });

        const localVideo =
            document.querySelector("#video-local video");

        if (localVideo) {
            localVideo.srcObject =
                localStream;
        }
    }
}

document.getElementById("muteButton")
    .addEventListener("click", () => {

        if (!localStream) return;

        const tracks =
            localStream.getAudioTracks();

        if (!tracks.length) return;

        tracks.forEach(track => {
            track.enabled = !track.enabled;
        });

        document.getElementById("muteButton")
            .classList.toggle(
                "active",
                !tracks[0].enabled
            );
    });

document.getElementById("cameraButton")
    .addEventListener("click", () => {

        if (!localStream) return;

        const tracks =
            localStream.getVideoTracks();

        if (!tracks.length) return;

        tracks.forEach(track => {
            track.enabled = !track.enabled;
        });

        document.getElementById("cameraButton")
            .classList.toggle(
                "active",
                !tracks[0].enabled
            );
    });

document.getElementById("screenButton")
    .addEventListener(
        "click",
        toggleScreenShare
    );

function closeCall() {

    if (callRoom) {

        socket.emit("call:leave", {
            room: callRoom
        });
    }

    peers.forEach(pc => pc.close());

    peers.clear();

    if (screenStream) {
        screenStream
            .getTracks()
            .forEach(track => track.stop());

        screenStream = null;
    }

    if (localStream) {
        localStream
            .getTracks()
            .forEach(track => track.stop());

        localStream = null;
    }

    callVideos.innerHTML = "";

    callWindow.classList.add("hidden");

    callRoom = null;
}

});

socket.on("app:info", message => {

    const username =
        localStorage.getItem("nova_username");

    if (

        !me

        socket.emit("user:login", {
            username
        });
    }
});

    if (callRoom) {
        socket.emit("call:leave", {
            room: callRoom
        });
    }
});
