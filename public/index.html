<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaChat</title>
<style>
:root{--bg:#0d1017;--panel:#151922;--panel2:#1d2330;--text:#f5f6fa;--muted:#8992a5;--accent:#5865f2;--green:#35d07f;--danger:#ed5364;--border:#2a3040}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;border:0}
#loginScreen{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#27315b,#0d1017 60%)}.login{width:min(430px,92vw);padding:38px;border:1px solid var(--border);border-radius:22px;background:var(--panel);box-shadow:0 30px 90px #0008}.login h1{margin:0 0 8px}.login p{color:var(--muted);margin-bottom:25px}.login-input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--border);background:#0d1017;color:white;outline:0}.login-button{width:100%;margin-top:12px;padding:14px;border-radius:12px;background:var(--accent);font-weight:800}
#app{display:none;height:100vh;grid-template-columns:76px 250px 1fr 230px}.servers{background:#0a0d13;padding:12px 10px;display:flex;flex-direction:column;gap:10px;align-items:center}.server{width:52px;height:52px;border-radius:16px;background:var(--panel2);font-weight:900}.server:hover,.server.active{background:var(--accent)}.sep{width:35px;height:1px;background:var(--border)}
.sidebar{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0}.server-title{height:65px;padding:12px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}.server-title small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.scroll{padding:12px;overflow:auto;flex:1}.cat{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:900;margin:15px 5px 6px}.channel{width:100%;padding:9px;border-radius:8px;background:transparent;text-align:left;color:#b9c0cf;display:flex;gap:9px;align-items:center}.channel:hover,.channel.active{background:var(--panel2);color:white}.userbox{padding:10px;border-top:1px solid var(--border);display:flex;gap:9px;align-items:center}.avatar{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#31384a);display:grid;place-items:center;font-weight:900}.uinfo{flex:1;min-width:0}.uinfo strong,.uinfo span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.uinfo span{font-size:11px;color:var(--green)}
.chat{display:flex;flex-direction:column;min-width:0}.header{height:65px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:12px}.hash{font-size:25px;color:var(--muted)}.desc{font-size:11px;color:var(--muted)}.actions{margin-left:auto}.search{width:190px;padding:9px 11px;border-radius:9px;border:1px solid var(--border);background:var(--panel);color:white}.messages{flex:1;overflow:auto;padding:20px}.message{display:flex;gap:10px;margin-bottom:15px}.body{max-width:min(760px,80%)}.head{display:flex;gap:8px;align-items:center}.name{font-weight:800}.time{font-size:10px;color:var(--muted)}.text{white-space:pre-wrap;overflow-wrap:anywhere;color:#dce1eb}.composerWrap{padding:12px 18px}.composer{display:flex;gap:8px;align-items:flex-end;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:7px}.composer textarea{flex:1;resize:none;background:transparent;color:white;border:0;outline:0;min-height:38px;padding:9px}.send{width:40px;height:40px;border-radius:11px;background:var(--accent)}
.members{background:var(--panel);border-left:1px solid var(--border);padding:16px;overflow:auto}.mtitle{font-size:11px;color:var(--muted);font-weight:900;margin:6px 0 10px}.member{display:flex;gap:9px;align-items:center;padding:8px;border-radius:9px}.member:hover{background:var(--panel2)}.memberName{font-weight:800;font-size:13px}
.voice{position:fixed;left:350px;right:250px;bottom:18px;background:#10141d;border:1px solid var(--border);border-radius:18px;padding:15px;z-index:20;box-shadow:0 20px 70px #0009;display:none}.vtop{display:flex;align-items:center;margin-bottom:12px}.vtop strong{flex:1}.vusers{display:flex;gap:9px;flex-wrap:wrap}.vuser{min-width:110px;padding:12px;background:var(--panel2);border:1px solid var(--border);border-radius:13px;text-align:center}.controls{display:flex;justify-content:center;gap:8px;margin-top:13px}.control{width:45px;height:45px;border-radius:13px;background:#242a38}.control.active{background:var(--accent)}.leave{background:var(--danger)}#audio{position:absolute;left:-9999px;width:1px;height:1px}
@media(max-width:900px){#app{grid-template-columns:60px 210px 1fr}.members{display:none}.voice{left:280px;right:10px}}@media(max-width:650px){#app{grid-template-columns:60px 1fr}.sidebar{display:none}.voice{left:10px;right:10px}}
</style></head><body>

<div id="loginScreen"><div class="login"><h1>Bienvenue sur NovaChat</h1><p>Une nouvelle façon de discuter, jouer et rester connecté.</p><input id="username" class="login-input" maxlength="24" placeholder="Ton nom d'utilisateur" autocomplete="off"><button id="login" class="login-button">Entrer dans NovaChat</button></div></div>

<div id="app">
<aside class="servers"><button class="server active">N</button><button class="server">G</button><button class="server">M</button><div class="sep"></div><button class="server">+</button></aside>
<aside class="sidebar"><div class="server-title"><div><strong>Nova Lounge</strong><small>Communauté officielle</small></div><button>•••</button></div><div class="scroll">
<div class="cat"><span>TEXTUEL</span><span>+</span></div>
<button class="channel active" data-channel="general"># général</button><button class="channel" data-channel="gaming"># gaming</button><button class="channel" data-channel="entraide"># entraide</button>
<div class="cat"><span>VOCAL</span><span>+</span></div>
<button class="channel voice-channel" data-room="general">◉ Salon général</button><button class="channel voice-channel" data-room="gaming">◉ Gaming</button><button class="channel voice-channel" data-room="chill">◉ Chill</button>
</div><div class="userbox"><div id="myAvatar" class="avatar">?</div><div class="uinfo"><strong id="myName">Utilisateur</strong><span>En ligne</span></div><button>⚙</button></div></aside>
<main class="chat"><header class="header"><div class="hash">#</div><div><strong id="chatName">général</strong><div class="desc">Discutez librement avec la communauté.</div></div><div class="actions"><input id="search" class="search" placeholder="Rechercher..."></div></header><div id="messages" class="messages"></div><div class="composerWrap"><div class="composer"><button id="emoji">🙂</button><textarea id="input" rows="1" placeholder="Écrire un message..."></textarea><button id="send" class="send">➤</button></div></div></main>
<aside class="members"><div class="mtitle">En ligne</div><div id="online"></div></aside></div>

<div id="voice" class="voice"><div class="vtop"><strong>🎙️ <span id="roomName">Salon vocal</span></strong><span id="status" style="color:var(--green)">Connecté</span></div><div id="vusers" class="vusers"></div><div id="audio"></div><div class="controls"><button id="mute" class="control active">🎤</button><button id="camera" class="control">📹</button><button id="screen" class="control">🖥️</button><button id="leave" class="control leave">☎</button></div></div>

<script>
const $=s=>document.querySelector(s);
const state={socket:null,user:null,channel:"general",messages:[],users:[],voice:{room:null,local:null,peers:new Map(),ice:new Map(),muted:false}};
function send(d){if(state.socket?.readyState===WebSocket.OPEN)state.socket.send(JSON.stringify(d))}
function connect(){
 const username=$("#username").value.trim();if(!username)return alert("Entre un nom d'utilisateur.");
 const p=location.protocol==="https:"?"wss":"ws";state.socket=new WebSocket(p+"://"+location.host);
 state.socket.onopen=()=>send({type:"login",username});
 state.socket.onmessage=e=>{try{handle(JSON.parse(e.data))}catch(err){console.error(err)}};
}
$("#login").onclick=connect;$("#username").onkeydown=e=>{if(e.key==="Enter")connect()};

function handle(d){
 if(d.type==="login-success"){state.user=d.user;$("#loginScreen").style.display="none";$("#app").style.display="grid";$("#myName").textContent=d.user.username;$("#myAvatar").textContent=d.user.avatar;requestChannel("general");return}
 if(d.type==="history"){if(d.channel===state.channel){state.messages=d.messages||[];renderMessages()}return}
 if(d.type==="new-message"){if(d.message.channel===state.channel){state.messages.push(d.message);renderMessages(true)}return}
 if(d.type==="presence"){state.users=d.users||[];renderMembers();renderVoiceUsers();return}
 if(d.type==="voice-peers"){d.peers.forEach(p=>createPeer(p.id,true));renderVoiceUsers();return}
 if(d.type==="voice-user-joined"){if(state.voice.room===d.room)renderVoiceUsers();return}
 if(d.type==="voice-user-left"){removePeer(d.userId);renderVoiceUsers();return}
 if(d.type==="webrtc-offer")return offer(d);
 if(d.type==="webrtc-answer")return answer(d);
 if(d.type==="webrtc-ice")return ice(d);
}
function requestChannel(c){state.channel=c;document.querySelectorAll("[data-channel]").forEach(b=>b.classList.toggle("active",b.dataset.channel===c));$("#chatName").textContent=c==="general"?"général":c;state.messages=[];renderMessages();send({type:"history",channel:c})}
document.querySelectorAll("[data-channel]").forEach(b=>b.onclick=()=>requestChannel(b.dataset.channel));
function renderMessages(scroll=false){$("#messages").innerHTML="";state.messages.forEach(m=>{const row=document.createElement("div");row.className="message";row.innerHTML='<div class="avatar">'+(m.username||"?")[0].toUpperCase()+'</div><div class="body"><div class="head"><span class="name"></span><span class="time"></span></div><div class="text"></div></div>';row.querySelector(".name").textContent=m.username;row.querySelector(".time").textContent=new Date(m.time).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});row.querySelector(".text").textContent=m.content;$("#messages").append(row)});if(scroll)$("#messages").scrollTop=$("#messages").scrollHeight}
function renderMembers(){$("#online").innerHTML="";state.users.forEach(u=>{const e=document.createElement("div");e.className="member";e.innerHTML='<div class="avatar">'+u.avatar+'</div><div class="memberName"></div>';e.querySelector(".memberName").textContent=u.username;$("#online").append(e)})}
function sendMessage(){const c=$("#input").value.trim();if(!c)return;send({type:"send-message",channel:state.channel,content:c});$("#input").value=""}
$("#send").onclick=sendMessage;$("#input").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}};$("#emoji").onclick=()=>{$("#input").value+="🙂";$("#input").focus()};

const rtc={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun.cloudflare.com:3478"}]};
async function media(){if(state.voice.local)return state.voice.local;state.voice.local=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});return state.voice.local}
async function createPeer(id,makeOffer){
 if(state.voice.peers.has(id))return state.voice.peers.get(id);
 const pc=new RTCPeerConnection(rtc);state.voice.peers.set(id,pc);
 const stream=await media();stream.getTracks().forEach(t=>pc.addTrack(t,stream));
 pc.onicecandidate=e=>{if(e.candidate)send({type:"webrtc-ice",targetId:id,candidate:e.candidate})};
 pc.ontrack=e=>{let a=document.getElementById("r-"+id);if(!a){a=document.createElement("audio");a.id="r-"+id;a.autoplay=true;a.playsInline=true;$("#audio").append(a)}a.srcObject=e.streams[0];a.play().catch(()=>{})};
 pc.onconnectionstatechange=()=>{if(["failed","closed"].includes(pc.connectionState))removePeer(id)};
 if(makeOffer){const o=await pc.createOffer();await pc.setLocalDescription(o);send({type:"webrtc-offer",targetId:id,offer:pc.localDescription})}
 return pc
}
async function flush(id,pc){const q=state.voice.ice.get(id)||[];for(const c of q)try{await pc.addIceCandidate(new RTCIceCandidate(c))}catch(e){}state.voice.ice.delete(id)}
async function offer(d){if(!state.voice.room)return;const pc=await createPeer(d.senderId,false);await pc.setRemoteDescription(new RTCSessionDescription(d.offer));await flush(d.senderId,pc);const a=await pc.createAnswer();await pc.setLocalDescription(a);send({type:"webrtc-answer",targetId:d.senderId,answer:pc.localDescription})}
async function answer(d){const pc=state.voice.peers.get(d.senderId);if(!pc)return;await pc.setRemoteDescription(new RTCSessionDescription(d.answer));await flush(d.senderId,pc)}
async function ice(d){if(!d.candidate)return;const pc=state.voice.peers.get(d.senderId);if(!pc||!pc.remoteDescription){if(!state.voice.ice.has(d.senderId))state.voice.ice.set(d.senderId,[]);state.voice.ice.get(d.senderId).push(d.candidate);return}try{await pc.addIceCandidate(new RTCIceCandidate(d.candidate))}catch(e){console.error(e)}}
function removePeer(id){const pc=state.voice.peers.get(id);if(pc)pc.close();state.voice.peers.delete(id);state.voice.ice.delete(id);document.getElementById("r-"+id)?.remove()}
function renderVoiceUsers(){if(!state.voice.room)return;$("#vusers").innerHTML="";state.users.filter(u=>u.id===state.user?.id||state.users.length).forEach(u=>{const e=document.createElement("div");e.className="vuser";e.textContent=u.username;$("#vusers").append(e)})}
async function joinVoice(room){if(state.voice.room)leaveVoice();try{await media()}catch(e){alert("Autorise le microphone dans ton navigateur.");return}state.voice.room=room;$("#voice").style.display="block";$("#roomName").textContent=room==="general"?"Salon général":room;send({type:"voice-join",room});renderVoiceUsers()}
function leaveVoice(){if(!state.voice.room)return;send({type:"voice-leave"});[...state.voice.peers.keys()].forEach(removePeer);state.voice.local?.getTracks().forEach(t=>t.stop());state.voice.local=null;state.voice.room=null;$("#voice").style.display="none";$("#audio").innerHTML=""}
document.querySelectorAll(".voice-channel").forEach(b=>b.onclick=()=>joinVoice(b.dataset.room));$("#leave").onclick=leaveVoice;
$("#mute").onclick=()=>{if(!state.voice.local)return;state.voice.muted=!state.voice.muted;state.voice.local.getAudioTracks().forEach(t=>t.enabled=!state.voice.muted);$("#mute").textContent=state.voice.muted?"🔇":"🎤";$("#mute").classList.toggle("active",!state.voice.muted)};
$("#camera").onclick=async()=>{if(!state.voice.room)return;try{const s=await navigator.mediaDevices.getUserMedia({video:true});const t=s.getVideoTracks()[0];for(const pc of state.voice.peers.values()){const sender=pc.getSenders().find(x=>x.track?.kind==="video");if(sender)await sender.replaceTrack(t);else pc.addTrack(t,s)}$("#camera").classList.add("active")}catch(e){alert("Impossible d'accéder à la caméra.")}};
$("#screen").onclick=async()=>{if(!state.voice.room)return;try{const s=await navigator.mediaDevices.getDisplayMedia({video:true});const t=s.getVideoTracks()[0];for(const pc of state.voice.peers.values()){const sender=pc.getSenders().find(x=>x.track?.kind==="video");if(sender)await sender.replaceTrack(t);else pc.addTrack(t,s)}$("#screen").classList.add("active");t.onended=()=>$("#screen").classList.remove("active")}catch(e){console.error(e)}};
window.addEventListener("beforeunload",()=>send({type:"voice-leave"}));
</script></body></html>
