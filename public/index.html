<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaChat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #1e1f22;
      --bg-dark: #111214;
      --bg-darker: #0d0e10;
      --panel: #2b2d31;
      --panel-light: #313338;
      --hover: #35373c;
      --active: #404249;
      --text: #f2f3f5;
      --muted: #b5bac1;
      --accent: #5865f2;
      --danger: #ed4245;
      --success: #23a559;
      --border: rgba(255,255,255,.06);
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       AUTH
    ========================= */

    #authScreen {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 20% 20%, #313780 0, transparent 30%),
        radial-gradient(circle at 80% 80%, #3d2457 0, transparent 30%),
        #111214;
    }

    .auth-card {
      width: 430px;
      max-width: calc(100vw - 30px);
      background: #2b2d31;
      border-radius: 8px;
      padding: 32px;
      box-shadow: 0 12px 40px rgba(0,0,0,.45);
    }

    .auth-logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .auth-subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 25px;
    }

    .auth-tabs {
      display: flex;
      margin-bottom: 20px;
      background: #1e1f22;
      border-radius: 6px;
      padding: 4px;
    }

    .auth-tab {
      flex: 1;
      border: 0;
      color: var(--muted);
      background: transparent;
      padding: 10px;
      border-radius: 4px;
    }

    .auth-tab.active {
      background: var(--accent);
      color: white;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .field input {
      width: 100%;
      border: 0;
      outline: 0;
      background: #1e1f22;
      color: white;
      border-radius: 5px;
      padding: 12px;
    }

    .primary-btn {
      width: 100%;
      border: 0;
      background: var(--accent);
      color: white;
      padding: 12px;
      border-radius: 5px;
      font-weight: bold;
      margin-top: 5px;
    }

    .primary-btn:hover {
      filter: brightness(1.1);
    }

    #authError {
      color: #ff7b7b;
      min-height: 20px;
      margin: 8px 0;
      font-size: 14px;
    }

    /* =========================
       APP
    ========================= */

    #app {
      width: 100vw;
      height: 100vh;
      display: flex;
    }

    /* SERVERS */

    #serverBar {
      width: 72px;
      background: var(--bg-darker);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      gap: 8px;
      overflow-y: auto;
    }

    .server-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 0;
      background: #313338;
      color: white;
      font-weight: bold;
      font-size: 18px;
      overflow: hidden;
      transition: .15s;
    }

    .server-icon:hover,
    .server-icon.active {
      border-radius: 15px;
      background: var(--accent);
    }

    .server-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .server-add {
      background: #1e1f22;
      color: #23a559;
      font-size: 25px;
    }

    /* SIDEBAR */

    #sidebar {
      width: 250px;
      background: #2b2d31;
      display: flex;
      flex-direction: column;
      min-width: 250px;
    }

    #sidebarHeader {
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 15px;
      border-bottom: 1px solid var(--border);
      font-weight: bold;
      box-shadow: 0 1px 2px rgba(0,0,0,.2);
    }

    #sidebarContent {
      flex: 1;
      overflow-y: auto;
      padding: 12px 8px;
    }

    .section-title {
      color: #949ba4;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      padding: 8px;
    }

    .friend {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: 5px;
      cursor: pointer;
      color: var(--muted);
    }

    .friend:hover {
      background: var(--hover);
      color: white;
    }

    .friend.active {
      background: var(--active);
      color: white;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #5865f2;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      font-weight: bold;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .friend-info {
      min-width: 0;
    }

    .friend-name {
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .friend-username {
      font-size: 12px;
      color: #949ba4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .channel {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      color: #949ba4;
      border-radius: 5px;
      cursor: pointer;
    }

    .channel:hover {
      background: var(--hover);
      color: white;
    }

    .channel.active {
      background: var(--active);
      color: white;
    }

    .channel-icon {
      font-size: 19px;
      width: 22px;
      text-align: center;
    }

    #userPanel {
      min-height: 60px;
      background: #232428;
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #currentUserInfo {
      flex: 1;
      min-width: 0;
    }

    #currentDisplayName {
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #currentUsername {
      color: #949ba4;
      font-size: 12px;
    }

    .small-btn {
      border: 0;
      background: transparent;
      color: #b5bac1;
      font-size: 18px;
      padding: 6px;
      border-radius: 5px;
    }

    .small-btn:hover {
      background: var(--hover);
      color: white;
    }

    /* MAIN */

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #topbar {
      height: 52px;
      min-height: 52px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      background: #313338;
      box-shadow: 0 1px 2px rgba(0,0,0,.2);
    }

    #topbarTitle {
      font-weight: bold;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #313338;
    }

    .welcome {
      max-width: 800px;
      margin: 60px auto;
      color: var(--muted);
      text-align: center;
    }

    .welcome h1 {
      color: white;
    }

    .message {
      display: flex;
      gap: 12px;
      padding: 8px 0;
    }

    .message:hover {
      background: rgba(0,0,0,.08);
    }

    .message-content {
      min-width: 0;
    }

    .message-header {
      display: flex;
      gap: 8px;
      align-items: baseline;
    }

    .message-name {
      font-weight: bold;
    }

    .message-date {
      color: #949ba4;
      font-size: 11px;
    }

    .message-text {
      color: #dbdee1;
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 2px;
    }

    #composer {
      padding: 12px 20px 20px;
      background: #313338;
    }

    #composerBox {
      background: #383a40;
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 10px;
    }

    #messageInput {
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      padding: 13px;
      resize: none;
    }

    #sendBtn {
      border: 0;
      background: transparent;
      color: #b5bac1;
      font-size: 20px;
      padding: 8px;
    }

    #sendBtn:hover {
      color: white;
    }

    /* EMPTY */

    .empty-state {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #949ba4;
      text-align: center;
      padding: 30px;
    }

    .empty-state h1 {
      color: white;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-card {
      width: 430px;
      max-width: calc(100vw - 30px);
      background: #313338;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,.5);
    }

    .modal-card h2 {
      margin-top: 0;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .secondary-btn {
      border: 0;
      background: #4e5058;
      color: white;
      padding: 10px 15px;
      border-radius: 5px;
    }

    .danger-btn {
      border: 0;
      background: var(--danger);
      color: white;
      padding: 10px 15px;
      border-radius: 5px;
    }

    /* PROFILE */

    .profile-avatar {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .profile-avatar .avatar {
      width: 90px;
      height: 90px;
      font-size: 30px;
    }

    /* VOICE */

    #voicePanel {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 340px;
      max-width: calc(100vw - 40px);
      background: #1e1f22;
      border: 1px solid #111214;
      border-radius: 10px;
      padding: 14px;
      z-index: 50;
      box-shadow: 0 15px 40px rgba(0,0,0,.45);
    }

    #voiceTitle {
      font-weight: bold;
      margin-bottom: 10px;
    }

    #voiceUsers {
      max-height: 250px;
      overflow-y: auto;
    }

    .voice-user {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px;
      border-radius: 5px;
    }

    .voice-user:hover {
      background: var(--hover);
    }

    .voice-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .voice-actions button {
      flex: 1;
      border: 0;
      padding: 9px;
      border-radius: 5px;
      background: #4e5058;
      color: white;
    }

    .voice-actions button.active {
      background: var(--accent);
    }

    /* MOBILE */

    @media (max-width: 800px) {
      #serverBar {
        width: 58px;
      }

      #sidebar {
        width: 210px;
        min-width: 210px;
      }

      .server-icon {
        width: 42px;
        height: 42px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       AUTHENTIFICATION

  <section id="authScreen">

    <div class="auth-card">

      <div class="auth-logo">NovaChat</div>

      <div class="auth-subtitle">
        Ton espace de discussion.
      </div>

        <button
          id="loginTab"
          class="auth-tab active"
          onclick="showAuth('login')"
        >
          Connexion
        </button>

        <button
          id="registerTab"
          class="auth-tab"
          onclick="showAuth('register')"
        >
          Créer un compte
        </button>
      </div>

      <!-- CONNEXION -->

      <form id="loginForm">

        <div class="field">
          <label>Email ou nom d'utilisateur</label>

          <input
            id="loginInput"
            type="text"
            autocomplete="username"
            placeholder="Email ou nom d'utilisateur"

        </div>

        <div class="field">
          <label>Mot de passe</label>

          <input

      <form

      >

            required

        </div>

        <div class="field">

          <input
            id="registerUsername"
            type="text"

        </div>

        <div class="field">

  <script src="/socket.io/socket.io.js"></script>

  <script>
    let socket = null;
    let currentUser = null;
    let currentFriend = null;
    let currentServer = null;
    let currentChannel = null;

    let friends = [];
    let servers = [];

    let localStream = null;
    let peerConnections = {};

    /*
    ================================================
    UTILITAIRES
    ================================================
    */

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text == null ? "" : String(text);
      return div.innerHTML;
    }

    function initials(name) {
      const value = String(name || "N").trim();

      if (!value) {
        return "N";
      }

      return value
        .split(/\s+/)
        .slice(0, 2)
        .map(part => part.charAt(0).toUpperCase())
        .join("");
    }

    function avatarHtml(user, sizeClass = "") {
      if (user && user.avatar) {
        return `
          <div class="avatar ${sizeClass}">
            <img src="${escapeHtml(user.avatar)}">
          </div>
        `;
      }

      return `
        <div class="avatar ${sizeClass}">
          ${escapeHtml(initials(user ? user.displayName : "N"))}
        </div>
      `;
    }

    function showError(elementId, message) {
      const element = document.getElementById(elementId);

      if (element) {
        element.textContent = message || "";
        element.style.color = "#ff7b7b";
        element.style.marginBottom = "10px";
      }
    }

    function clearError(elementId) {
      const element = document.getElementById(elementId);

      if (element) {
        element.textContent = "";
      }
    }

    async function api(url, options = {}) {
      const response = await fetch(url, options);

      let data;

      try {
        data = await response.json();
      } catch {
        throw new Error("Réponse invalide du serveur.");
      }

      if (!response.ok || data.ok === false) {
        throw new Error(
          data.error || "Une erreur est survenue."
        );
      }

      return data;
    }

    function saveCurrentUser() {
      localStorage.setItem(
        "novachat_user",
        JSON.stringify(currentUser)
      );
    }

    function loadCurrentUser() {
      try {
        const saved = localStorage.getItem("novachat_user");

        if (!saved) {
          return null;
        }

        return JSON.parse(saved);
      } catch {
        return null;
      }
    }

    /*
    ================================================
    AUTH
    ================================================
    */

      const registerTab = document.getElementById("registerTab");

      clearError("loginError");
      clearError("registerError");

      if (type === "register") {
        loginForm.classList.add("hidden");
        registerForm.classList.remove("hidden");

        loginTab.classList.remove("active");
        registerTab.classList.add("active");
      } else {
        registerForm.classList.add("hidden");
        loginForm.classList.remove("hidden");

        registerTab.classList.remove("active");
        loginTab.classList.add("active");
      }

    async function startApp() {
      document
        .getElementById("authScreen")
        .classList.add("hidden");

      document
        .getElementById("app")
        .classList.remove("hidden");

      updateCurrentUserUI();

      connectSocket();

      await loadFriends();
      await loadServers();

    function connectSocket() {
      if (socket) {
        socket.disconnect();
      }

      socket = io();

      socket.on("connect", () => {
        console.log("Socket connecté.");

        socket.emit(
          "identify",
          currentUser.id
        );
      });

      socket.on("connect_error", error => {
        console.error("Socket error:", error);
      });

      socket.on("dm_message", message => {
        if (
          currentFriend &&
          (
            message.from === currentFriend.id ||
            message.to === currentFriend.id
          )
        ) {
          loadDm(currentFriend.id);
        }
      });

      socket.on("channel_message", message => {
        if (
          currentServer &&
          currentChannel &&
          message.channelId === currentChannel.id
        ) {
          addMessageToScreen(message);
        }
      });

      socket.on("server_created", serverData => {
        if (
          serverData.members &&
          serverData.members.includes(currentUser.id)
        ) {
          loadServers();
        }
      });

      socket.on("friend_added", data => {
        if (
          data.userId === currentUser.id ||
          data.friendId === currentUser.id
        ) {
          loadFriends();
        }
      });

      socket.on("user_updated", user => {
        if (currentUser && user.id === currentUser.id) {
          currentUser = user;
          saveCurrentUser();
          updateCurrentUserUI();
        }

        loadFriends();
      });

      socket.on("presence", data => {
        updatePresence(
          data.userId,
          data.online
        );
      });

      setupVoiceSocket();
    }

    function renderMessages(messages) {
      const container =
        document.getElementById("messages");

      container.innerHTML = "";

      messages.forEach(message => {
        addMessageToScreen(message, false);
      });

      container.scrollTop =
        container.scrollHeight;

    function addMessageToScreen(
      message,
      scroll = true
    ) {
      const container =
        document.getElementById("messages");

      const user =
        findCachedUser(message.from) ||
        {
          displayName:
            message.displayName ||
            "Utilisateur",
          username:
            message.username ||
            "",
          avatar:
            message.avatar ||
            ""
        };

      const element =
        document.createElement("div");

      element.className = "message";

      element.innerHTML = `
        ${avatarHtml(user)}

        <div class="message-content">

          <div class="message-header">

            <span class="message-name">
              ${escapeHtml(
                user.displayName
              )}
            </span>

            <span class="message-date">
              ${new Date(
                message.createdAt
              ).toLocaleTimeString(
                "fr-FR",
                {
                  hour: "2-digit",
                  minute: "2-digit"
                }
              )}
            </span>

          </div>

          <div class="message-text">
            ${escapeHtml(message.content)}
          </div>

        </div>
      `;

      container.appendChild(element);

      if (scroll) {
        container.scrollTop =
          container.scrollHeight;
      }
    }

    function findCachedUser(userId) {
      if (
        currentUser &&
        currentUser.id === userId
      ) {
        return currentUser;
      }

      return friends.find(
        user => user.id === userId
      );
    }

    async function sendMessage() {
      const input =
        document.getElementById(
          "messageInput"
        );

      const content =
        input.value.trim();

      if (!content) {
        return;
      }

      if (
        currentFriend &&
        !currentServer
      ) {
        socket.emit("dm_send", {
          to: currentFriend.id,
          content
        });
      }

      if (
        currentServer &&
        currentChannel &&
        currentChannel.type === "text"
      ) {
        socket.emit("channel_send", {
          serverId: currentServer.id,
          channelId: currentChannel.id,
          content
        });
      }

      input.value = "";
      input.focus();
    }

    document
      .getElementById("sendBtn")
      .addEventListener(
        "click",
        sendMessage
      );

      .getElementById("messageInput")
      .addEventListener(
        "keydown",
        event => {
          if (
            event.key === "Enter" &&
            !event.shiftKey
          ) {
            event.preventDefault();
            sendMessage();
          }
        }
      );

          reader.readAsDataURL(file);
        }

    /*
    ================================================
    VOIX / WEBRTC
    ================================================
    */

    function setupVoiceSocket() {
      socket.on(
        "voice_users",
        data => {
          if (
            currentChannel &&
            currentChannel.id === data.channelId
          ) {
            renderVoiceUsers(
              data.users || []
            );
          }
        }
      );

      socket.on(
        "voice_user_joined",
        async data => {
          if (!localStream) {
            return;
          }

          await createPeerConnection(
            data.socketId,
            true
          );
        }
      );

      socket.on(
        "voice_user_left",
        data => {
          if (
            peerConnections[
              data.socketId
            ]
          ) {
            peerConnections[
              data.socketId
            ].close();

            delete peerConnections[
              data.socketId
            ];
          }
        }
      );

      socket.on(
        "webrtc_offer",
        async data => {
          if (!localStream) {
            return;
          }

          const peer =
            await createPeerConnection(
              data.from,
              false
            );

          await peer.setRemoteDescription(
            new RTCSessionDescription(
              data.offer
            )
          );

          const answer =
            await peer.createAnswer();

          await peer.setLocalDescription(
            answer
          );

          socket.emit(
            "webrtc_answer",
            {
              target: data.from,
              answer
            }
          );
        }
      );

      socket.on(
        "webrtc_answer",
        async data => {
          const peer =
            peerConnections[data.from];

          if (!peer) {
            return;
          }

          await peer.setRemoteDescription(
            new RTCSessionDescription(
              data.answer
            )
          );
        }
      );

      socket.on(
        "webrtc_ice",
        async data => {
          const peer =
            peerConnections[data.from];

          if (!peer || !data.candidate) {
            return;
          }

          try {
            await peer.addIceCandidate(
              new RTCIceCandidate(
                data.candidate
              )
            );
          } catch (error) {
            console.error(
              "ICE error:",
              error
            );
          }
        }
      );
    }

    async function joinVoice(channel) {
      try {
        if (localStream) {
          leaveVoice();
        }

        currentChannel = channel;

        localStream =
          await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: false
          });

        document
          .getElementById("voicePanel")
          .classList.remove("hidden");

        document.getElementById(
          "voiceTitle"
        ).textContent =
          "🔊 " + channel.name;

        document.getElementById(
          "voiceUsers"
        ).innerHTML =
          avatarHtml(currentUser) +
          `<span>${escapeHtml(
            currentUser.displayName
          )}</span>`;

        socket.emit(
          "voice_join",
          {
            serverId: currentServer.id,
            channelId: channel.id
          }
        );

      } catch (error) {
        console.error(error);

        alert(
          "Impossible d'utiliser ton microphone. Vérifie les permissions du navigateur."
        );
      }
    }

    async function createPeerConnection(
      socketId,
      createOffer
    ) {
      if (
        peerConnections[socketId]
      ) {
        return peerConnections[socketId];
      }

      const peer =
        new RTCPeerConnection({
          iceServers: [
            {
              urls: "stun:stun.l.google.com:19302"
            },
            {
              urls: "stun:stun1.l.google.com:19302"
            }
          ]
        });

      peerConnections[socketId] =
        peer;

      localStream
        .getTracks()
        .forEach(track => {
          peer.addTrack(
            track,
            localStream
          );
        });

      peer.onicecandidate =
        event => {
          if (
            event.candidate
          ) {
            socket.emit(
              "webrtc_ice",
              {
                target: socketId,
                candidate:
                  event.candidate
              }
            );
          }
        };

      peer.ontrack =
        event => {
          let audio =
            document.getElementById(
              "audio-" + socketId
            );

          if (!audio) {
            audio =
              document.createElement(
                "audio"
              );

            audio.id =
              "audio-" + socketId;

            audio.autoplay = true;

            document.body.appendChild(
              audio
            );
          }

          audio.srcObject =
            event.streams[0];
        };

      if (createOffer) {
        const offer =
          await peer.createOffer();

        await peer.setLocalDescription(
          offer
        );

        socket.emit(
          "webrtc_offer",
          {
            target: socketId,
            offer
          }
        );
      }

      return peer;
    }

    function renderVoiceUsers(users) {
      const container =
        document.getElementById(
          "voiceUsers"
        );

      container.innerHTML = "";

      users.forEach(item => {
        const user =
          item.user;

        const element =
          document.createElement("div");

        element.className =
          "voice-user";

        element.innerHTML = `
          ${avatarHtml(user)}

          <div>
            ${escapeHtml(
              user.displayName
            )}
          </div>
        `;

        container.appendChild(
          element
        );
      });
    }

    function toggleMute() {
      if (!localStream) {
        return;
      }

      const tracks =
        localStream.getAudioTracks();

      if (!tracks.length) {
        return;
      }

      const enabled =
        tracks[0].enabled;

      tracks.forEach(track => {
        track.enabled =
          !enabled;
      });

      document.getElementById(
        "muteButton"
      ).textContent =
        enabled
          ? "🔇 Micro coupé"
          : "🎙️ Micro";
    }

    function leaveVoice() {
      if (socket) {
        socket.emit("voice_leave");
      }

      Object.values(
        peerConnections
      ).forEach(peer => {
        try {
          peer.close();
        } catch {}
      });

      peerConnections = {};

      if (localStream) {
        localStream
          .getTracks()
          .forEach(track =>
            track.stop()
          );

        localStream = null;
      }

      document
        .querySelectorAll("audio[id^='audio-']")
        .forEach(audio => {
          audio.srcObject = null;
          audio.remove();
        });

      document
        .getElementById("voicePanel")
        .classList.add("hidden");
    }

    /*
    ================================================
    INITIALISATION
    ================================================
    */

    window.addEventListener(
      "beforeunload",
      () => {
        if (localStream) {
          leaveVoice();
        }
      }
    );

    const savedUser =
      loadCurrentUser();

    if (savedUser && savedUser.id) {
      currentUser = savedUser;

      startApp();
    }
  </script>
